services:
  facetec-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: letsgoride/facetec-server:latest
    restart: unless-stopped
    ports:
      - "${FACETEC_SERVER_PORT:-8080}:8080"
    environment:
      FACETEC_SERVER_PORT: "8080"
      FACETEC_SERVER_KEY_IDENTIFIER: "${FACETEC_SERVER_KEY_IDENTIFIER}"
      FACETEC_ORCHESTRATION_URL: "${FACETEC_ORCHESTRATION_URL}"
    volumes:
      - type: bind
        source: ${FACETEC_SERVER_SDK_DIR}
        target: /opt/facetec/server
        read_only: true
      - type: bind
        source: ${FACETEC_CONFIG_DIR}
        target: /opt/facetec/config
      - type: volume
        source: facetec-data
        target: /opt/facetec/data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  facetec-data:
