name: Prepare multi-work-product accounts

on:
  push:
    branches:
      - feat/multi-work-product-accounts
    paths:
      - .github/workflows/prepare-multi-work-products.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-work-product-accounts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply multi-work-product changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "backend/app/services/workforce_service.py",
              '''async def save_worker_application(payload: Dict[str, Any], user: Dict[str, Any]) -> Dict[str, Any]:\n    if user.get("role") != "passenger":\n        raise PermissionError("Applications begin from a Customer account. Existing work accounts keep their current product access.")\n    if not payload.get("accepted_terms"):\n        raise ValueError("Accept the application declaration before continuing.")\n    product = str(payload.get("product") or "")\n    if product not in REQUIRED_DOCUMENTS:\n        raise ValueError("Unsupported worker product.")\n''',
              '''async def save_worker_application(payload: Dict[str, Any], user: Dict[str, Any]) -> Dict[str, Any]:\n    current_role = str(user.get("role") or "passenger").strip().lower()\n    approved_products = {\n        str(value).strip().lower()\n        for value in (user.get("work_products") or [])\n        if str(value).strip().lower() in {"driver", "courier"}\n    }\n    if current_role in {"driver", "courier"}:\n        approved_products.add(current_role)\n    if current_role not in {"passenger", "driver", "courier"}:\n        raise PermissionError("Only Customer, Driver or Courier accounts can start a Driver or Courier application.")\n    if not payload.get("accepted_terms"):\n        raise ValueError("Accept the application declaration before continuing.")\n    product = str(payload.get("product") or "")\n    if product not in REQUIRED_DOCUMENTS:\n        raise ValueError("Unsupported worker product.")\n    if product == "merchant" and current_role != "passenger":\n        raise PermissionError("Merchant onboarding requires a Customer account without another work product.")\n    if product in approved_products:\n        raise ValueError("This work product is already approved for your account.")\n''',
          )

          replace_once(
              "backend/app/services/workforce_service.py",
              '''        product = str(application.get("product") or "")\n        if applicant.get("role") not in {"passenger", product}:\n            raise ValueError("Applicant already belongs to another work product.")\n        await database.update_one(\n            "users",\n            applicant["id"],\n            {\n                "role": product,\n                "name": application.get("full_name") or applicant.get("name"),\n                "phone": application.get("phone") or applicant.get("phone"),\n                "city": application.get("service_area") or applicant.get("city"),\n                "verification_status": "approved" if product == "driver" else applicant.get("verification_status", "not_started"),\n                "updated_at": now,\n            },\n        )\n''',
              '''        product = str(application.get("product") or "")\n        current_role = str(applicant.get("role") or "passenger").strip().lower()\n        approved_products = {\n            str(value).strip().lower()\n            for value in (applicant.get("work_products") or [])\n            if str(value).strip().lower() in {"driver", "courier"}\n        }\n        if current_role in {"driver", "courier"}:\n            approved_products.add(current_role)\n        if product in {"driver", "courier"}:\n            if current_role not in {"passenger", "driver", "courier"}:\n                raise ValueError("Applicant already belongs to an incompatible work product.")\n            approved_products.add(product)\n            next_role = product if current_role == "passenger" else current_role\n        else:\n            if current_role not in {"passenger", product}:\n                raise ValueError("Applicant already belongs to another work product.")\n            next_role = product\n        await database.update_one(\n            "users",\n            applicant["id"],\n            {\n                "role": next_role,\n                "work_products": sorted(approved_products),\n                "name": application.get("full_name") or applicant.get("name"),\n                "phone": application.get("phone") or applicant.get("phone"),\n                "city": application.get("service_area") or applicant.get("city"),\n                "verification_status": "approved" if product == "driver" else applicant.get("verification_status", "not_started"),\n                "updated_at": now,\n            },\n        )\n''',
          )

          replace_once(
              "backend/app/services/workforce_service.py",
              '"Your application was approved. Sign in again to open your work product." if status == "APPROVED" else "Your application status changed. Open Work with LetsGoRide for details.",',
              '"Your application was approved. Open Account to use your approved work mode." if status == "APPROVED" else "Your application status changed. Open Work with LetsGoRide for details.",',
          )

          replace_once(
              "mobile/types/user.types.ts",
              '  role: UserRole;\n',
              '  work_products?: Array<"driver" | "courier">;\n  role: UserRole;\n',
          )

          replace_once(
              "mobile/services/authService.ts",
              'import { User } from "../types/user.types";\n',
              'import { User, UserRole } from "../types/user.types";\n',
          )
          replace_once(
              "mobile/services/authService.ts",
              '''export async function getCurrentUser() {\n  return requestData<User>({ method: "GET", url: "/auth/me" });\n}\n\n''',
              '''export async function getCurrentUser() {\n  return requestData<User>({ method: "GET", url: "/auth/me" });\n}\n\nexport async function switchWorkMode(role: Extract<UserRole, "driver" | "courier">) {\n  const user = await requestData<User>({ method: "POST", url: "/auth/work-mode", data: { role } });\n  publishSessionUser(user);\n  return user;\n}\n\n''',
          )

          replace_once(
              "mobile/app/(driver)/account.tsx",
              'import { AccountDetailsSummary } from "../../components/account/AccountDetailsSummary";\n',
              'import { AccountDetailsSummary } from "../../components/account/AccountDetailsSummary";\nimport { WorkModeSwitcher } from "../../components/account/WorkModeSwitcher";\n',
          )
          replace_once(
              "mobile/app/(driver)/account.tsx",
              '''      </View>\n\n      {!photoApproved ? (\n''',
              '''      </View>\n\n      <WorkModeSwitcher />\n\n      {!photoApproved ? (\n''',
          )

          replace_once(
              "mobile/app/(courier)/account.tsx",
              'import { AccountDetailsSummary } from "../../components/account/AccountDetailsSummary";\n',
              'import { AccountDetailsSummary } from "../../components/account/AccountDetailsSummary";\nimport { WorkModeSwitcher } from "../../components/account/WorkModeSwitcher";\n',
          )
          replace_once(
              "mobile/app/(courier)/account.tsx",
              '''      </Pressable>\n      <AccountDetailsSummary''',
              '''      </Pressable>\n      <WorkModeSwitcher />\n      <AccountDetailsSummary''',
          )

          Path("mobile/components/account/WorkModeSwitcher.tsx").write_text('''import { MaterialCommunityIcons } from "@expo/vector-icons";\nimport { useRouter } from "expo-router";\nimport { useMemo, useState } from "react";\nimport { Pressable, StyleSheet, Text, View } from "react-native";\n\nimport { v2Theme } from "../../constants/v2Theme";\nimport { useCurrentUser } from "../../hooks/useCurrentUser";\nimport { switchWorkMode } from "../../services/authService";\n\ntype WorkMode = "driver" | "courier";\n\nconst labels: Record<WorkMode, string> = { driver: "Driver", courier: "Courier" };\nconst icons: Record<WorkMode, keyof typeof MaterialCommunityIcons.glyphMap> = { driver: "steering", courier: "bike-fast" };\n\nexport function WorkModeSwitcher() {\n  const router = useRouter();\n  const { user } = useCurrentUser();\n  const [busy, setBusy] = useState<WorkMode | null>(null);\n  const [error, setError] = useState<string | null>(null);\n  const available = useMemo(() => {\n    const modes = new Set<WorkMode>();\n    for (const value of user?.work_products || []) {\n      if (value === "driver" || value === "courier") modes.add(value);\n    }\n    if (user?.role === "driver" || user?.role === "courier") modes.add(user.role);\n    return [...modes];\n  }, [user?.role, user?.work_products]);\n\n  if (!user || available.length < 2 || (user.role !== "driver" && user.role !== "courier")) return null;\n\n  async function changeMode(target: WorkMode) {\n    if (target === user?.role || busy) return;\n    try {\n      setBusy(target);\n      setError(null);\n      await switchWorkMode(target);\n      router.replace((target === "driver" ? "/(driver)/home" : "/(courier)/home") as never);\n    } catch (nextError) {\n      setError(nextError instanceof Error ? nextError.message : "Unable to switch work mode.");\n    } finally {\n      setBusy(null);\n    }\n  }\n\n  return (\n    <View style={styles.card}>\n      <View style={styles.heading}>\n        <View style={styles.icon}>\n          <MaterialCommunityIcons name="swap-horizontal-bold" size={22} color={v2Theme.colors.brandStrong} />\n        </View>\n        <View style={styles.copy}>\n          <Text style={styles.title}>Work mode</Text>\n          <Text style={styles.body}>Driver and Courier are approved on this account. Go offline and finish active work before switching.</Text>\n        </View>\n      </View>\n      <View style={styles.options}>\n        {available.map((mode) => {\n          const active = user.role === mode;\n          return (\n            <Pressable\n              key={mode}\n              accessibilityRole="button"\n              accessibilityState={{ selected: active, disabled: Boolean(busy) }}\n              onPress={() => void changeMode(mode)}\n              disabled={Boolean(busy) || active}\n              style={({ pressed }) => [styles.option, active && styles.optionActive, pressed && !active && styles.pressed]}\n            >\n              <MaterialCommunityIcons name={icons[mode]} size={19} color={active ? "#FFFFFF" : v2Theme.colors.ink} />\n              <Text style={[styles.optionText, active && styles.optionTextActive]}>{busy === mode ? "Switching…" : labels[mode]}</Text>\n            </Pressable>\n          );\n        })}\n      </View>\n      {error ? <Text style={styles.error}>{error}</Text> : null}\n    </View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  card: { borderRadius: 23, backgroundColor: v2Theme.colors.surface, borderWidth: StyleSheet.hairlineWidth, borderColor: v2Theme.colors.line, padding: 13, gap: 11 },\n  heading: { flexDirection: "row", alignItems: "center", gap: 10 },\n  icon: { width: 44, height: 44, borderRadius: 15, backgroundColor: v2Theme.colors.brandSofter, alignItems: "center", justifyContent: "center" },\n  copy: { flex: 1 },\n  title: { color: v2Theme.colors.ink, fontSize: 14, fontWeight: "900" },\n  body: { color: v2Theme.colors.inkSecondary, fontSize: 9, lineHeight: 14, marginTop: 2 },\n  options: { flexDirection: "row", gap: 8 },\n  option: { flex: 1, minHeight: 46, borderRadius: 15, backgroundColor: v2Theme.colors.surfaceMuted, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 7 },\n  optionActive: { backgroundColor: v2Theme.colors.ink },\n  optionText: { color: v2Theme.colors.ink, fontSize: 10, fontWeight: "900" },\n  optionTextActive: { color: "#FFFFFF" },\n  error: { color: v2Theme.colors.danger, fontSize: 9, lineHeight: 14, fontWeight: "700" },\n  pressed: { opacity: 0.72 },\n});\n''')

          Path("mobile/app/(shared)/work-with-us.tsx").write_text('''import { MaterialCommunityIcons } from "@expo/vector-icons";\nimport { useRouter } from "expo-router";\nimport { Pressable, StyleSheet, Text, View } from "react-native";\n\nimport { Screen } from "../../components/ui/Screen";\nimport { v2Theme } from "../../constants/v2Theme";\nimport { useCurrentUser } from "../../hooks/useCurrentUser";\nimport { WorkerProduct } from "../../types/operations.types";\nimport { intentForProduct } from "../../utils/authIntent";\n\nconst products: Array<{ product: WorkerProduct; icon: keyof typeof MaterialCommunityIcons.glyphMap; title: string; body: string }> = [\n  { product: "courier", icon: "bike-fast", title: "Apply to deliver", body: "Courier profile, vehicle, identity and selfie review before work access." },\n  { product: "driver", icon: "steering", title: "Become a Driver", body: "Identity, licence, vehicle and selfie review before Ride Now access." },\n  { product: "merchant", icon: "storefront-outline", title: "Partner with LetsGoRide", body: "Business and owner review before restaurant onboarding and activation." },\n];\n\nexport default function WorkWithUsScreen() {\n  const router = useRouter();\n  const { user, isGuest, loading } = useCurrentUser();\n  const approved = new Set<WorkerProduct>();\n  for (const value of user?.work_products || []) {\n    if (value === "driver" || value === "courier") approved.add(value);\n  }\n  if (user?.role === "driver" || user?.role === "courier" || user?.role === "merchant") approved.add(user.role);\n\n  function unavailable(product: WorkerProduct) {\n    if (!user) return false;\n    if (approved.has(product)) return true;\n    if (user.role === "admin" || user.role === "merchant") return true;\n    if (product === "merchant" && user.role !== "passenger") return true;\n    return false;\n  }\n\n  function open(product: WorkerProduct) {\n    if (loading || unavailable(product)) return;\n    if (isGuest) {\n      router.push({ pathname: "/(auth)/email-login", params: { intent: intentForProduct(product) } } as never);\n      return;\n    }\n    router.push({ pathname: "/(shared)/worker-application", params: { product } } as never);\n  }\n\n  const activeWorker = user?.role === "driver" || user?.role === "courier";\n  const approvedLabel = [...approved].map((value) => value === "driver" ? "Driver" : value === "courier" ? "Courier" : "Merchant").join(" + ");\n\n  return (\n    <Screen title="Work with us" showBack fallbackRoute="/(shared)/account">\n      <View style={styles.hero}>\n        <Text style={styles.eyebrow}>WORK WITH LETSGORIDE</Text>\n        <Text style={styles.title}>Choose how you’d like to join.</Text>\n        <Text style={styles.body}>Tell us about yourself or your business. You can save your progress and return before submitting.</Text>\n      </View>\n      {activeWorker ? (\n        <View style={styles.current}>\n          <MaterialCommunityIcons name="check-decagram-outline" size={24} color={v2Theme.colors.brandStrong} />\n          <Text style={styles.currentText}>{approvedLabel || "Your work product"} is approved. You may also apply for the other Driver or Courier product using the same account.</Text>\n        </View>\n      ) : null}\n      <View style={styles.list}>\n        {products.map((item) => {\n          const disabled = loading || unavailable(item.product);\n          return (\n            <Pressable key={item.product} accessibilityRole="button" onPress={() => open(item.product)} disabled={disabled} style={({ pressed }) => [styles.card, disabled && styles.disabled, pressed && styles.pressed]}>\n              <View style={styles.icon}><MaterialCommunityIcons name={item.icon} size={29} color={v2Theme.colors.brandStrong} /></View>\n              <View style={styles.flex}>\n                <Text style={styles.cardTitle}>{item.title}</Text>\n                <Text style={styles.cardBody}>{approved.has(item.product) ? "Already approved on this account." : item.body}</Text>\n              </View>\n              <MaterialCommunityIcons name={approved.has(item.product) ? "check" : "arrow-right"} size={21} color={v2Theme.colors.inkTertiary} />\n            </Pressable>\n          );\n        })}\n      </View>\n      {isGuest ? (\n        <View style={styles.signIn}>\n          <Text style={styles.signInTitle}>Already have an account?</Text>\n          <Text style={styles.cardBody}>Choose an application above and we’ll keep your selection while you sign in.</Text>\n        </View>\n      ) : null}\n    </Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  flex: { flex: 1 },\n  hero: { borderRadius: 27, backgroundColor: v2Theme.colors.ink, padding: 19, gap: 9 },\n  eyebrow: { color: "#8FE6AE", fontSize: 9, fontWeight: "900", letterSpacing: 1.1 },\n  title: { color: "#FFFFFF", fontSize: 28, lineHeight: 33, fontWeight: "900", letterSpacing: -0.8 },\n  body: { color: "rgba(255,255,255,0.65)", fontSize: 11, lineHeight: 17 },\n  current: { borderRadius: 20, backgroundColor: v2Theme.colors.brandSofter, padding: 13, flexDirection: "row", gap: 9 },\n  currentText: { flex: 1, color: v2Theme.colors.inkSecondary, fontSize: 10, lineHeight: 15 },\n  list: { gap: 9 },\n  card: { borderRadius: 24, backgroundColor: v2Theme.colors.surface, padding: 14, flexDirection: "row", alignItems: "center", gap: 11 },\n  icon: { width: 54, height: 54, borderRadius: 19, backgroundColor: v2Theme.colors.brandSoft, alignItems: "center", justifyContent: "center" },\n  cardTitle: { color: v2Theme.colors.ink, fontSize: 14, fontWeight: "900" },\n  cardBody: { color: v2Theme.colors.inkSecondary, fontSize: 10, lineHeight: 15, marginTop: 3 },\n  signIn: { borderRadius: 24, backgroundColor: v2Theme.colors.surfaceMuted, padding: 15, gap: 7 },\n  signInTitle: { color: v2Theme.colors.ink, fontSize: 14, fontWeight: "900" },\n  disabled: { opacity: 0.48 },\n  pressed: { opacity: 0.72 },\n});\n''')

          Path("backend/tests/test_multi_work_product.py").write_text('''import unittest\n\nfrom fastapi import HTTPException\n\nfrom app.database import COLLECTION_NAMES, database\nfrom app.models.user import WorkModeBody\nfrom app.routers.auth import switch_work_mode\nfrom app.services.workforce_service import review_worker_application, save_worker_application, submit_worker_application\n\n\nclass MultiWorkProductTests(unittest.IsolatedAsyncioTestCase):\n    async def asyncSetUp(self):\n        database.db = None\n        for collection in COLLECTION_NAMES:\n            await database.replace_collection(collection, [])\n\n    async def _user(self, user_id: str, role: str = "passenger", **extra):\n        user = {\n            "id": user_id,\n            "role": role,\n            "name": user_id.title(),\n            "email": f"{user_id}@example.com",\n            "phone": "+263770000001",\n            "city": "Harare",\n            **extra,\n        }\n        await database.insert_one("users", user)\n        return user\n\n    async def _submitted_application(self, user, product: str):\n        payload = {\n            "product": product,\n            "full_name": "Dual Worker",\n            "phone": "+263770000001",\n            "service_area": "Harare",\n            "service_area_id": "harare",\n            "vehicle_type": "sedan" if product == "driver" else "motorbike",\n            "vehicle_details": "Approved work vehicle",\n            "accepted_terms": True,\n        }\n        application = await save_worker_application(payload, user)\n        required = ("identity_document", "selfie", "driver_licence", "vehicle_registration") if product == "driver" else ("identity_document", "selfie")\n        await database.update_one(\n            "worker_applications",\n            application["id"],\n            {"documents": [{"id": value, "document_type": value, "file_name": f"{value}.jpg", "status": "PENDING"} for value in required]},\n        )\n        return await submit_worker_application(application["id"], user)\n\n    async def test_driver_and_courier_can_be_approved_on_one_account_and_switched(self):\n        applicant = await self._user("dual-worker")\n        admin = await self._user("admin", "admin")\n\n        driver_application = await self._submitted_application(applicant, "driver")\n        await review_worker_application(driver_application["id"], "APPROVED", "Driver approved", admin)\n        after_driver = await database.find_one("users", {"id": applicant["id"]})\n        self.assertEqual(after_driver["role"], "driver")\n        self.assertEqual(after_driver["work_products"], ["driver"])\n\n        courier_application = await self._submitted_application(after_driver, "courier")\n        await review_worker_application(courier_application["id"], "APPROVED", "Courier approved", admin)\n        dual = await database.find_one("users", {"id": applicant["id"]})\n        self.assertEqual(dual["role"], "driver")\n        self.assertEqual(set(dual["work_products"]), {"driver", "courier"})\n        self.assertIsNotNone(await database.find_one("drivers", {"user_id": applicant["id"]}))\n        self.assertIsNotNone(await database.find_one("courier_profiles", {"user_id": applicant["id"]}))\n\n        switched = await switch_work_mode(WorkModeBody(role="courier"), dual)\n        self.assertTrue(switched["success"])\n        self.assertEqual(switched["data"]["role"], "courier")\n        courier_user = await database.find_one("users", {"id": applicant["id"]})\n        self.assertEqual(courier_user["role"], "courier")\n\n        switched_back = await switch_work_mode(WorkModeBody(role="driver"), courier_user)\n        self.assertEqual(switched_back["data"]["role"], "driver")\n\n    async def test_switching_is_blocked_while_current_work_mode_is_online(self):\n        user = await self._user("busy-driver", "driver", work_products=["driver", "courier"])\n        await database.insert_one("drivers", {"id": "driver-profile", "user_id": user["id"], "verified": True, "verification_status": "approved"})\n        await database.insert_one("hailing_driver_presence", {"id": "presence", "driver_id": "driver-profile", "status": "available"})\n\n        with self.assertRaises(HTTPException) as raised:\n            await switch_work_mode(WorkModeBody(role="courier"), user)\n        self.assertEqual(raised.exception.status_code, 409)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY
      - name: Verify patch shape
        run: |
          git diff --check
          git status --short
      - name: Commit prepared implementation
        run: |
          git config user.name "deonvault-crypto"
          git config user.email "deonvault@gmail.com"
          git add backend/app/services/workforce_service.py backend/tests/test_multi_work_product.py mobile/types/user.types.ts mobile/services/authService.ts mobile/components/account/WorkModeSwitcher.tsx 'mobile/app/(driver)/account.tsx' 'mobile/app/(courier)/account.tsx' 'mobile/app/(shared)/work-with-us.tsx'
          git commit -m "Support Driver and Courier modes on one account" || exit 0
          git push origin HEAD:feat/multi-work-product-accounts
