name: Admin Control Center Finalize Once

on:
  push:
    branches:
      - fix/admin-control-center-production
    paths:
      - .github/workflows/admin-control-center-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize-admin:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout admin recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-control-center-production
          fetch-depth: 0

      - name: Apply admin sync, local mutation, and scale fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # --- Backend admin status semantics + cheap live overview ---
          admin = Path('backend/app/routers/admin.py')
          text = admin.read_text()

          marker = 'router = APIRouter(prefix="/admin", tags=["admin"])\nlogger = logging.getLogger(__name__)\n'
          addition = '''router = APIRouter(prefix="/admin", tags=["admin"])
          logger = logging.getLogger(__name__)

          VERIFIED_DRIVER_VERIFICATION_STATUSES = {"approved", "verified", "active"}
          PENDING_DRIVER_VERIFICATION_STATUSES = {
              "pending",
              "pending_uploads",
              "pending_auto_check",
              "needs_review",
              "needs_resubmission",
          }


          def _is_verified_driver_verification(status: Optional[str]) -> bool:
              return str(status or "").strip().lower() in VERIFIED_DRIVER_VERIFICATION_STATUSES


          def _is_pending_driver_verification(status: Optional[str]) -> bool:
              return str(status or "").strip().lower() in PENDING_DRIVER_VERIFICATION_STATUSES
          '''
          if marker in text:
              text = text.replace(marker, addition, 1)
          elif 'VERIFIED_DRIVER_VERIFICATION_STATUSES' not in text:
              raise SystemExit('admin router insertion marker not found')

          old_tone = '''def _status_tone(status: Optional[str]) -> str:
              if status in {"verified", "confirmed", "resolved", "active", "open"}:
                  return "success"
              if status in {"rejected", "cancelled", "cancelled_by_admin", "cancelled_by_driver", "cancelled_by_passenger", "suspended", "deleted", "dismissed"}:
                  return "danger"
              if status in {"pending", "needs_review", "submitted", "received", "in_review", "declined", "closed"}:
                  return "warning"
              return "neutral"
          '''
          new_tone = '''def _status_tone(status: Optional[str]) -> str:
              normalized = str(status or "").strip().lower()
              if _is_verified_driver_verification(normalized) or normalized in {"confirmed", "resolved", "open", "completed"}:
                  return "success"
              if normalized in {"rejected", "cancelled", "cancelled_by_admin", "cancelled_by_driver", "cancelled_by_passenger", "suspended", "deleted", "dismissed"}:
                  return "danger"
              if _is_pending_driver_verification(normalized) or normalized in {"submitted", "received", "in_review", "declined", "closed"}:
                  return "warning"
              return "neutral"
          '''
          if old_tone in text:
              text = text.replace(old_tone, new_tone, 1)

          start = text.index('@router.get("/overview")')
          end = text.index('@router.get("/users")', start)
          new_overview = '''@router.get("/overview")
          async def overview(admin=Depends(get_admin_user)):
              verified_filter = {
                  "$or": [
                      {"verification_status": {"$in": sorted(VERIFIED_DRIVER_VERIFICATION_STATUSES)}},
                      {
                          "verification_status": {"$exists": False},
                          "verified": True,
                          "status": {"$in": ["approved", "active"]},
                      },
                  ]
              }
              pending_filter = {
                  "verification_status": {"$in": sorted(PENDING_DRIVER_VERIFICATION_STATUSES)}
              }
              active_ride_statuses = [
                  "SCHEDULED", "BOARDING", "IN_PROGRESS", "OPEN", "DEPARTED",
                  "scheduled", "boarding", "in_progress", "open", "departed",
              ]

              (
                  user_count,
                  ride_count,
                  request_count,
                  verified_driver_count,
                  pending_verification_count,
                  active_ride_count,
                  pending_request_count,
                  confirmed_booking_count,
                  support_count,
                  open_support_count,
                  report_count,
                  open_report_count,
                  unread_notification_count,
                  recent_requests,
                  recent_drivers,
                  recent_support,
                  recent_reports,
              ) = await asyncio.gather(
                  database.count("users"),
                  database.count("rides", {"is_demo": {"$ne": True}}),
                  database.count("ride_requests"),
                  database.count("drivers", verified_filter),
                  database.count("drivers", pending_filter),
                  database.count("rides", {"is_demo": {"$ne": True}, "status": {"$in": active_ride_statuses}}),
                  database.count("ride_requests", {"status": "pending"}),
                  database.count("ride_requests", {"status": "confirmed"}),
                  database.count("support_messages"),
                  database.count("support_messages", {"status": {"$nin": ["resolved", "closed"]}}),
                  database.count("reports"),
                  database.count("reports", {"status": {"$nin": ["resolved", "dismissed"]}}),
                  database.count("app_notifications", {"user_id": admin["id"], "read": {"$ne": True}}),
                  database.find_many("ride_requests", sort=[("updated_at", -1)], limit=8),
                  database.find_many("drivers", sort=[("updated_at", -1)], limit=8),
                  database.find_many("support_messages", sort=[("updated_at", -1)], limit=6),
                  database.find_many("reports", sort=[("updated_at", -1)], limit=6),
              )

              activities = []
              for request in recent_requests:
                  activities.append(
                      _activity_item(
                          kind="ride_request",
                          title=f"{request.get('passenger_name') or 'Passenger'} - {_request_route(request)}",
                          subtitle=f"{request.get('seats', 1)} seat request",
                          status=request.get("status"),
                          target_type="ride_request",
                          target_id=request.get("id", ""),
                          created_at=request.get("created_at") or request.get("updated_at"),
                      )
                  )
              for driver in recent_drivers:
                  verification_status = public_verification_status(driver)
                  if _is_pending_driver_verification(verification_status) or _is_verified_driver_verification(verification_status) or verification_status == "rejected":
                      activities.append(
                          _activity_item(
                              kind="verification",
                              title=f"{driver.get('name') or 'Driver'} verification",
                              subtitle=f"{len(manual_verification_documents(driver.get('documents', [])))} documents submitted",
                              status=verification_status,
                              target_type="driver",
                              target_id=driver.get("id", ""),
                              created_at=driver.get("verification_submitted_at") or driver.get("updated_at") or driver.get("created_at"),
                          )
                      )
              for message in recent_support:
                  activities.append(
                      _activity_item(
                          kind="support",
                          title=message.get("subject") or "Support case",
                          subtitle=message.get("user_name") or message.get("user_email") or "User",
                          status=message.get("status"),
                          target_type="support_message",
                          target_id=message.get("id", ""),
                          created_at=message.get("created_at") or message.get("updated_at"),
                      )
                  )
              for report in recent_reports:
                  activities.append(
                      _activity_item(
                          kind="safety_report",
                          title=report.get("report_type") or "Safety report",
                          subtitle=report.get("user_name") or report.get("user_email") or "User",
                          status=report.get("status"),
                          target_type="report",
                          target_id=report.get("id", ""),
                          created_at=report.get("created_at") or report.get("updated_at"),
                      )
                  )

              return api_success(
                  {
                      "users": user_count,
                      "total_users": user_count,
                      "verified_drivers": verified_driver_count,
                      "pending_verifications": pending_verification_count,
                      "pending_driver_verifications": pending_verification_count,
                      "rides": ride_count,
                      "active_rides": active_ride_count,
                      "requests": request_count,
                      "pending_ride_requests": pending_request_count,
                      "confirmed_bookings": confirmed_booking_count,
                      "support_messages": support_count,
                      "open_support_cases": open_support_count,
                      "safety_reports": report_count,
                      "open_safety_reports": open_report_count,
                      "unread_admin_notifications": unread_notification_count,
                      "recent_activity": _sort_recent(activities, 12),
                  }
              )


          '''
          text = text[:start] + new_overview + text[end:]

          old_filter = '''        if verification and verification_status != verification:
                      continue
          '''
          new_filter = '''        if verification:
                      requested_verification = str(verification).strip().lower()
                      if requested_verification in VERIFIED_DRIVER_VERIFICATION_STATUSES:
                          if not _is_verified_driver_verification(verification_status):
                              continue
                      elif requested_verification in PENDING_DRIVER_VERIFICATION_STATUSES:
                          if not _is_pending_driver_verification(verification_status):
                              continue
                      elif verification_status != requested_verification:
                          continue
          '''
          if old_filter in text:
              text = text.replace(old_filter, new_filter, 1)
          admin.write_text(text)

          # --- Indexes for the exact live-control query shapes ---
          db = Path('backend/app/database.py')
          db_text = db.read_text()
          index_marker = '''        await self.db["ride_requests"].create_index(
                      [("user_id", 1), ("updated_at", -1)],
                      name="ride_requests_by_passenger",
                  )
          '''
          index_addition = index_marker + '''        await self.db["drivers"].create_index(
                      [("verification_status", 1), ("updated_at", -1)],
                      name="admin_driver_verification_queue",
                  )
                  await self.db["rides"].create_index(
                      [("status", 1), ("is_demo", 1), ("updated_at", -1)],
                      name="admin_rides_by_status",
                  )
                  await self.db["ride_requests"].create_index(
                      [("status", 1), ("updated_at", -1)],
                      name="admin_requests_by_status",
                  )
                  await self.db["support_messages"].create_index(
                      [("status", 1), ("updated_at", -1)],
                      name="admin_support_by_status",
                  )
                  await self.db["reports"].create_index(
                      [("status", 1), ("updated_at", -1)],
                      name="admin_reports_by_status",
                  )
                  await self.db["app_notifications"].create_index(
                      [("user_id", 1), ("read", 1), ("created_at", -1)],
                      name="admin_notifications_unread",
                  )
          '''
          if 'admin_driver_verification_queue' not in db_text:
              if index_marker not in db_text:
                  raise SystemExit('database admin index insertion marker not found')
              db_text = db_text.replace(index_marker, index_addition, 1)
          db.write_text(db_text)

          # --- Mobile route now uses the new control center ---
          Path('mobile/app/(admin)/dashboard.tsx').write_text(
              'export { default } from "../../components/admin/AdminControlCenter";\n'
          )

          # --- Mutations update local rows immediately, then reconcile only cheap counters ---
          control = Path('mobile/components/admin/AdminControlCenter.tsx')
          c = control.read_text()
          c = c.replace(
              '''      await reasonAction.onConfirm(reason.trim());
                    setReasonAction(null);
                    setReason("");
                    await refreshAfterMutation();
          ''',
              '''      await reasonAction.onConfirm(reason.trim());
                    setReasonAction(null);
                    setReason("");
                    await loadCore();
          ''',
          )
          c = c.replace(
              '''                await updateAdminSupportStatus(id, status);
                          await refreshAfterMutation();
          ''',
              '''                const updated = await updateAdminSupportStatus(id, status);
                          setSupport((current) => current.map((item) => (item.id === updated.id ? updated : item)));
                          await loadCore();
          ''',
          )
          c = c.replace(
              '''                await updateAdminReportStatus(id, status);
                          await refreshAfterMutation();
          ''',
              '''                const updated = await updateAdminReportStatus(id, status);
                          setReports((current) => current.map((item) => (item.id === updated.id ? updated : item)));
                          await loadCore();
          ''',
          )
          c = c.replace(
              '''                  await updateAdminRequestStatus(request.id, "cancelled_by_admin", actionReason);
          ''',
              '''                  const updated = await updateAdminRequestStatus(request.id, "cancelled_by_admin", actionReason);
                            setRequests((current) => current.map((item) => (item.id === updated.id ? updated : item)));
          ''',
          )
          c = c.replace(
              '''                  await updateAdminUserStatus(user.id, "suspended", actionReason);
          ''',
              '''                  const updated = await updateAdminUserStatus(user.id, "suspended", actionReason);
                            setUsers((current) => current.map((item) => (item.id === updated.id ? { ...item, ...updated } : item)));
          ''',
          )
          c = c.replace(
              '''                await updateAdminUserStatus(user.id, "active");
                          await refreshAfterMutation();
          ''',
              '''                const updated = await updateAdminUserStatus(user.id, "active");
                          setUsers((current) => current.map((item) => (item.id === updated.id ? { ...item, ...updated } : item)));
                          await loadCore();
          ''',
          )
          c = c.replace(
              '''                await updateAdminRideStatus(ride.id, "closed");
                          await refreshAfterMutation();
          ''',
              '''                const updated = await updateAdminRideStatus(ride.id, "closed");
                          setRides((current) => current.map((item) => (item.id === updated.id ? updated : item)));
                          await loadCore();
          ''',
          )
          c = c.replace(
              '''                await updateAdminRideStatus(ride.id, "open");
                          await refreshAfterMutation();
          ''',
              '''                const updated = await updateAdminRideStatus(ride.id, "open");
                          setRides((current) => current.map((item) => (item.id === updated.id ? updated : item)));
                          await loadCore();
          ''',
          )
          c = c.replace(
              '''                  await updateAdminRideStatus(ride.id, "cancelled", actionReason);
          ''',
              '''                  const updated = await updateAdminRideStatus(ride.id, "cancelled", actionReason);
                            setRides((current) => current.map((item) => (item.id === updated.id ? updated : item)));
          ''',
          )
          control.write_text(c)

          # Keep the old sanitation contract, but point it at the implementation file.
          polling = Path('mobile/__tests__/polling-sanitation.test.ts')
          p = polling.read_text()
          p = p.replace(
              '    const admin = read("app/(admin)/dashboard.tsx");\n',
              '    const admin = read("components/admin/AdminControlCenter.tsx");\n',
          )
          polling.write_text(p)

          # Backend regression contracts.
          Path('backend/tests/test_admin_verification_status_semantics.py').write_text('''import inspect
          import pytest

          from app.routers import admin as admin_router
          from app.routers.admin import (
              _is_pending_driver_verification,
              _is_verified_driver_verification,
              _status_tone,
          )


          @pytest.mark.parametrize("status", ["approved", "verified", "active"])
          def test_admin_counts_current_approved_driver_statuses(status):
              assert _is_verified_driver_verification(status) is True
              assert _status_tone(status) == "success"


          @pytest.mark.parametrize(
              "status",
              ["pending", "pending_uploads", "pending_auto_check", "needs_review", "needs_resubmission"],
          )
          def test_admin_counts_all_actionable_verification_statuses(status):
              assert _is_pending_driver_verification(status) is True
              assert _status_tone(status) == "warning"


          def test_rejected_verification_is_not_counted_as_pending_or_approved():
              assert _is_pending_driver_verification("rejected") is False
              assert _is_verified_driver_verification("rejected") is False
              assert _status_tone("rejected") == "danger"


          def test_live_admin_overview_uses_counts_and_bounded_recent_tails():
              source = inspect.getsource(admin_router.overview)
              assert 'database.count("users")' in source
              assert 'database.count("drivers", verified_filter)' in source
              assert 'limit=8' in source
              assert 'limit=6' in source
              assert 'database.find_many("users")' not in source
              assert 'apply_ride_lifecycle' not in source
          ''')

          # Mobile control-center contract extends the original test suite.
          Path('mobile/__tests__/admin-control-center-wiring.test.ts').write_text('''import fs from "fs";
          import path from "path";

          describe("admin control center recovery", () => {
            const root = path.resolve(__dirname, "..");
            const source = fs.readFileSync(path.join(root, "components/admin/AdminControlCenter.tsx"), "utf8");
            const route = fs.readFileSync(path.join(root, "app/(admin)/dashboard.tsx"), "utf8");

            it("uses the new operations control center route", () => {
              expect(route).toContain("AdminControlCenter");
              expect(source).toContain("Needs attention");
              expect(source).toContain("Platform controls");
            });

            it("keeps admin data reconciled while the control center is open", () => {
              expect(source).toContain("useRealtime");
              expect(source).toContain("ADMIN_CONNECTED_RECONCILIATION_MS = 15000");
              expect(source).toContain("ADMIN_RECOVERY_RECONCILIATION_MS = 8000");
              expect(source).toContain("setTimeout");
              expect(source).not.toContain("setInterval");
              expect(source).toContain("reconciliationRevision");
            });

            it("guards verification metrics against stale backend status semantics", () => {
              expect(source).toContain('"approved", "verified", "active"');
              expect(source).toContain('"pending_uploads"');
              expect(source).toContain('pending_driver_verifications: pendingCount');
            });

            it("applies mutation responses locally instead of reloading entire sections", () => {
              expect(source).toContain("setSupport((current)");
              expect(source).toContain("setReports((current)");
              expect(source).toContain("setUsers((current)");
              expect(source).toContain("setRequests((current)");
              expect(source).toContain("setRides((current)");
            });
          });
          ''')
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile backend
        working-directory: backend
        run: python -m compileall app

      - name: Run admin backend contracts
        working-directory: backend
        run: python -m pytest -q tests/test_admin_verification_status_semantics.py

      - name: Run backend regression suite
        working-directory: backend
        run: python -m pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Run mobile regression suite
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Verify Android release config
        working-directory: mobile
        run: npm run verify:android

      - name: Commit validated admin recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "letsgoride-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            backend/app/routers/admin.py \
            backend/app/database.py \
            backend/tests/test_admin_verification_status_semantics.py \
            mobile/app/'(admin)'/dashboard.tsx \
            mobile/components/admin/AdminControlCenter.tsx \
            mobile/__tests__/polling-sanitation.test.ts \
            mobile/__tests__/admin-control-center-wiring.test.ts
          git diff --cached --check
          git commit -m "Fix live admin control center sync and operations UI"
          git push origin HEAD:fix/admin-control-center-production
