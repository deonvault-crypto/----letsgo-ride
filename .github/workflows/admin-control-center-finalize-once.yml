name: Build 39 Final Cleanup Once

on:
  push:
    branches:
      - final/build39-cleanup
    paths:
      - .github/workflows/admin-control-center-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize-build39:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout final cleanup branch
        uses: actions/checkout@v4
        with:
          ref: final/build39-cleanup
          fetch-depth: 0

      - name: Apply final production cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"Patch marker not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          # #5 — Customer Ride is Ride Now only. No customer-facing intercity doorway.
          replace_once(
              "mobile/app/(shared)/services.tsx",
              '<ServiceStoryCard title="Ride" subtitle="Search local journeys and planned city-to-city trips" eyebrow="GO SOMEWHERE" icon="car-outline" image={require("../../assets/images/ride-harare-owned-v2.jpg")} onPress={() => router.push("/(customer)/search" as never)} />',
              '<ServiceStoryCard title="Ride" subtitle="Request a nearby ride with live driver matching" eyebrow="RIDE NOW" icon="car-outline" image={require("../../assets/images/ride-harare-owned-v2.jpg")} onPress={() => router.push("/(shared)/location-picker?kind=dropoff&flow=hailing&focus=1" as never)} />',
          )
          replace_once(
              "mobile/app/(shared)/services.tsx",
              '  eyebrow: { color: v2Theme.colors.brandStrong, fontSize: 11, fontWeight: "900", letterSpacing: 1.25 },',
              '  eyebrow: { color: v2Theme.colors.inkTertiary, fontSize: 11, fontWeight: "900", letterSpacing: 1.25 },',
          )

          # #10 — Verification is identity + licence + live selfie. Legacy vehicle docs stay
          # accepted for Build 38 compatibility, but are not required or advertised.
          verification = Path("backend/app/services/verification_service.py")
          text = verification.read_text()
          old = '''REQUIRED_DOCUMENTS = [
              "selfie",
              "identity_document",
              "driver_license",
              "vehicle_registration_or_logbook",
              "vehicle_photo_optional",
          ]
          '''
          new = '''REQUIRED_DOCUMENTS = [
              "selfie",
              "identity_document",
              "driver_license",
          ]
          LEGACY_OPTIONAL_DOCUMENT_TYPES = {
              "vehicle_registration_or_logbook",
              "vehicle_photo_optional",
          }
          SUPPORTED_DOCUMENT_TYPES = set(REQUIRED_DOCUMENTS) | LEGACY_OPTIONAL_DOCUMENT_TYPES
          '''
          if old not in text:
              raise SystemExit("verification required-document block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              'REQUIRED_DOCUMENT_TYPES = set(REQUIRED_DOCUMENTS) - {"vehicle_photo_optional"}',
              'REQUIRED_DOCUMENT_TYPES = set(REQUIRED_DOCUMENTS)',
              1,
          )
          text = text.replace(
              'return normalized if normalized in REQUIRED_DOCUMENTS else None',
              'return normalized if normalized in SUPPORTED_DOCUMENT_TYPES else None',
              1,
          )
          verification.write_text(text)

          mobile_verification = Path("mobile/app/(shared)/verification.tsx")
          text = mobile_verification.read_text()
          text = text.replace(
              '''const manualDocumentTypes: VerificationDocumentType[] = [
            "selfie",
            "identity_document",
            "driver_license",
            "vehicle_registration_or_logbook",
            "vehicle_photo_optional",
          ];''',
              '''const manualDocumentTypes: VerificationDocumentType[] = [
            "selfie",
            "identity_document",
            "driver_license",
          ];''',
              1,
          )
          for line in [
              '  vehicle_registration_or_logbook: "Registration or logbook",\n',
              '  vehicle_photo_optional: "Vehicle photo",\n',
              '  vehicle_registration_or_logbook: "Capture the vehicle registration or logbook details.",\n',
              '  vehicle_photo_optional: "Take a clear exterior photo of the vehicle passengers will see.",\n',
              '  vehicle_registration_or_logbook: "Scan registration/logbook",\n',
              '  vehicle_photo_optional: "Take vehicle photo",\n',
          ]:
              text = text.replace(line, "")
          text = text.replace(
              '  const requiredCaptureDocuments = requiredDocuments.filter((item) => item !== "vehicle_photo_optional");',
              '  const requiredCaptureDocuments = requiredDocuments;',
              1,
          )
          text = text.replace(
              "Complete a camera-based identity check before posting public rides.",
              "Complete a camera-based identity and licence check before driving with Ride Now.",
              1,
          )
          text = text.replace(
              "LetsGoRide uses live capture for your selfie, identity document, driver licence, and vehicle record. If automated checks need help, the same captured documents move to manual review.",
              "LetsGoRide uses live capture for your selfie, identity document and driver licence. If automated checks need help, the same captured documents move to manual review.",
              1,
          )
          text = text.replace(
              "Use the camera for each check. Make sure names, faces, licence numbers, and vehicle details are sharp and readable.",
              "Use the camera for each check. Make sure names, faces and licence numbers are sharp and readable.",
              1,
          )
          text = text.replace(
              '''I consent to LetsGoRide reviewing my identity and vehicle
                documents for driver verification, safety, and fraud
                prevention.''',
              '''I consent to LetsGoRide reviewing my identity documents and driver licence
                for driver verification, safety, and fraud prevention.''',
              1,
          )
          mobile_verification.write_text(text)

          # #11 — one canonical all-three-class launch policy, including persisted city metadata.
          hailing_city = Path("backend/app/services/hailing_city_service.py")
          text = hailing_city.read_text()
          text = text.replace("PRICING_VERSION = 2", 'PRICING_VERSION = 3\nLAUNCH_RIDE_CLASSES = ("ECONOMY", "COMFORT", "XL")', 1)
          start = text.index("DEFAULT_CITY_PRICING = {")
          end = text.index("\n}\n\nDEFAULT_DISPATCH_SETTINGS", start) + 2
          default_block = text[start:end].replace('"enabled": False', '"enabled": True')
          text = text[:start] + default_block + text[end:]
          old_enabled = '''def enabled_ride_classes(city: Dict[str, Any]) -> List[str]:
              pricing = city.get("pricing") or {}
              return [
                  ride_class
                  for ride_class in ("ECONOMY", "COMFORT", "XL")
                  if bool((pricing.get(ride_class) or {}).get("enabled"))
              ]
          '''
          new_enabled = '''def enabled_ride_classes(city: Dict[str, Any]) -> List[str]:
              _ = city
              return list(LAUNCH_RIDE_CLASSES)
          '''
          if old_enabled not in text:
              raise SystemExit("enabled_ride_classes marker not found")
          text = text.replace(old_enabled, new_enabled, 1)
          old_migrate = '''        if all(current.get(field) == value for field, value in legacy.items()):
                      migrated[ride_class] = dict(DEFAULT_CITY_PRICING[ride_class])
                      changed = True
          '''
          new_migrate = '''        if all(current.get(field) == value for field, value in legacy.items()):
                      migrated[ride_class] = dict(DEFAULT_CITY_PRICING[ride_class])
                      changed = True
                      continue
                  sanitized = dict(current)
                  if sanitized.get("enabled") is not True:
                      sanitized["enabled"] = True
                      migrated[ride_class] = sanitized
                      changed = True
          '''
          if old_migrate not in text:
              raise SystemExit("legacy pricing migration marker not found")
          text = text.replace(old_migrate, new_migrate, 1)
          old_update = '''        if key in data:
                      value = data.pop(key)
                      pricing[field] = bool(value) if field == "enabled" else float(value)
              return pricing
          '''
          new_update = '''        if key in data:
                      value = data.pop(key)
                      if field != "enabled":
                          pricing[field] = float(value)
              pricing["enabled"] = True
              return pricing
          '''
          if old_update not in text:
              raise SystemExit("pricing update marker not found")
          text = text.replace(old_update, new_update, 1)
          hailing_city.write_text(text)

          # #12 — premium, subtle, Reduce-Motion-aware driver-search animation.
          Path("mobile/app/(customer)/hail/searching.tsx").write_text(r'''import { MaterialCommunityIcons } from "@expo/vector-icons";
          import { useLocalSearchParams, useRouter } from "expo-router";
          import { useEffect, useMemo, useRef, useState } from "react";
          import { AccessibilityInfo, Animated, Easing, Pressable, StatusBar, StyleSheet, Text, View } from "react-native";
          import { SafeAreaView, useSafeAreaInsets } from "react-native-safe-area-context";

          import { HailingMapBackdrop } from "../../../components/hailing/HailingMapBackdrop";
          import { BottomNav } from "../../../components/layout/BottomNav";
          import { AppNotice } from "../../../components/ui/AppNotice";
          import { v2Theme } from "../../../constants/v2Theme";
          import { useActiveHailingTrip } from "../../../hooks/useHailing";
          import { cancelHailingTrip } from "../../../services/hailingService";

          const RIDE_BLACK = "#111111";
          const SHEET_BOTTOM = v2Theme.control.navHeight + 26;

          function DriverSearchRadar({ active }: { active: boolean }) {
            const [reduceMotion, setReduceMotion] = useState(false);
            const pulseOne = useRef(new Animated.Value(0)).current;
            const pulseTwo = useRef(new Animated.Value(0)).current;
            const pulseThree = useRef(new Animated.Value(0)).current;
            const carLift = useRef(new Animated.Value(0)).current;

            useEffect(() => {
              let mounted = true;
              AccessibilityInfo.isReduceMotionEnabled().then((enabled) => {
                if (mounted) setReduceMotion(enabled);
              }).catch(() => undefined);
              const subscription = AccessibilityInfo.addEventListener("reduceMotionChanged", setReduceMotion);
              return () => {
                mounted = false;
                subscription.remove();
              };
            }, []);

            useEffect(() => {
              pulseOne.stopAnimation();
              pulseTwo.stopAnimation();
              pulseThree.stopAnimation();
              carLift.stopAnimation();
              if (!active || reduceMotion) {
                pulseOne.setValue(0.34);
                pulseTwo.setValue(0.2);
                pulseThree.setValue(0.08);
                carLift.setValue(0);
                return;
              }

              const pulse = (value: Animated.Value, delay: number) => Animated.loop(
                Animated.sequence([
                  Animated.delay(delay),
                  Animated.timing(value, { toValue: 1, duration: 1450, easing: Easing.out(Easing.cubic), useNativeDriver: true }),
                  Animated.timing(value, { toValue: 0, duration: 1, useNativeDriver: true }),
                  Animated.delay(Math.max(0, 900 - delay)),
                ]),
              );
              const lift = Animated.loop(Animated.sequence([
                Animated.timing(carLift, { toValue: -2, duration: 900, easing: Easing.inOut(Easing.quad), useNativeDriver: true }),
                Animated.timing(carLift, { toValue: 0, duration: 900, easing: Easing.inOut(Easing.quad), useNativeDriver: true }),
              ]));
              const animations = [pulse(pulseOne, 0), pulse(pulseTwo, 320), pulse(pulseThree, 640), lift];
              animations.forEach((animation) => animation.start());
              return () => animations.forEach((animation) => animation.stop());
            }, [active, carLift, pulseOne, pulseThree, pulseTwo, reduceMotion]);

            const ringStyle = (value: Animated.Value, baseScale: number) => ({
              opacity: value.interpolate({ inputRange: [0, 1], outputRange: [0.32, 0] }),
              transform: [{ scale: value.interpolate({ inputRange: [0, 1], outputRange: [baseScale, baseScale + 0.58] }) }],
            });

            return (
              <View accessibilityLabel="Searching nearby for an approved driver" style={styles.radar}>
                <Animated.View pointerEvents="none" style={[styles.radarRing, ringStyle(pulseThree, 0.72)]} />
                <Animated.View pointerEvents="none" style={[styles.radarRing, ringStyle(pulseTwo, 0.58)]} />
                <Animated.View pointerEvents="none" style={[styles.radarRing, ringStyle(pulseOne, 0.44)]} />
                <Animated.View style={[styles.radarCar, { transform: [{ translateY: carLift }] }]}>
                  <MaterialCommunityIcons name="car" size={25} color="#FFFFFF" />
                </Animated.View>
              </View>
            );
          }

          export default function HailingSearchingScreen() {
            const router = useRouter();
            const insets = useSafeAreaInsets();
            const params = useLocalSearchParams<{ tripId?: string }>();
            const { trip, loading, error, reload, setTrip, realtimeState } = useActiveHailingTrip(true);
            const [elapsedSeconds, setElapsedSeconds] = useState(0);
            const [cancelling, setCancelling] = useState(false);

            useEffect(() => {
              if (!trip || trip.status !== "SEARCHING") return undefined;
              const start = trip.created_at ? new Date(trip.created_at).getTime() : Date.now();
              const update = () => setElapsedSeconds(Math.max(0, Math.floor((Date.now() - start) / 1000)));
              update();
              const timer = setInterval(update, 1000);
              return () => clearInterval(timer);
            }, [trip?.created_at, trip?.id, trip?.status]);

            useEffect(() => {
              if (loading || !trip || trip.status === "SEARCHING" || trip.status === "NO_DRIVER_FOUND") return;
              router.replace(`/(customer)/hail/trip/${trip.id}` as never);
            }, [loading, router, trip?.id, trip?.status]);

            async function cancel() {
              const id = trip?.id || params.tripId;
              if (!id) {
                router.replace("/(customer)/hail" as never);
                return;
              }
              try {
                setCancelling(true);
                const next = await cancelHailingTrip(id, "Passenger cancelled while searching");
                setTrip(next);
                router.replace(`/(customer)/hail/trip/${next.id}` as never);
              } catch {
                void reload();
              } finally {
                setCancelling(false);
              }
            }

            const noDriver = trip?.status === "NO_DRIVER_FOUND";
            const live = realtimeState === "connected";
            const searchCopy = useMemo(() => {
              if (loading && !trip) return { eyebrow: "RESTORING RIDE", title: "Restoring your ride request…", body: "Checking the server for your active Ride Now request." };
              if (elapsedSeconds < 15) return { eyebrow: "MATCHING YOU", title: "Finding nearby drivers…", body: "Checking approved drivers closest to your pickup." };
              if (elapsedSeconds < 45) return { eyebrow: "EXPANDING SEARCH", title: "Checking more nearby drivers…", body: "We’re widening the search while keeping your request active." };
              return { eyebrow: "STILL SEARCHING", title: "Searching across nearby areas…", body: "Your request is still active. You can leave this screen — we’ll notify you when a driver accepts." };
            }, [elapsedSeconds, loading, trip]);

            return (
              <SafeAreaView edges={[]} style={styles.root}>
                <StatusBar barStyle="dark-content" />
                <HailingMapBackdrop pickup={trip?.pickup} dropoff={trip?.dropoff} route={trip?.route} bottomPadding={374} />

                <View pointerEvents="box-none" style={[styles.topBar, { top: insets.top + 8 }]}>
                  <Pressable accessibilityRole="button" accessibilityLabel="Back to Home" hitSlop={8} onPress={() => router.replace("/(customer)/home" as never)} style={({ pressed }) => [styles.topButton, pressed && styles.pressed]}>
                    <MaterialCommunityIcons name="chevron-left" size={27} color={RIDE_BLACK} />
                  </Pressable>
                  {trip ? <View style={styles.tripPill}><Text style={styles.tripPillText}>{trip.route.distance_km.toFixed(1)} km · ${trip.fare.total_fare.toFixed(2)}</Text></View> : <View style={styles.tripPill}><Text style={styles.tripPillText}>RIDE NOW</Text></View>}
                  <View accessibilityLabel={live ? "Ride updates connected" : "Ride updates reconnecting"} style={styles.liveButton}>
                    <View style={[styles.liveDot, !live && styles.liveDotSyncing]} />
                    <MaterialCommunityIcons name="access-point" size={18} color={RIDE_BLACK} />
                  </View>
                </View>

                <View style={styles.sheet}>
                  <View style={styles.handle} />
                  <View style={styles.content}>
                    {!noDriver ? <DriverSearchRadar active={!loading && trip?.status === "SEARCHING"} /> : null}
                    <View style={styles.statusRow}>
                      <View style={[styles.statusIcon, noDriver && styles.statusIconWarning]}>
                        <MaterialCommunityIcons name={noDriver ? "car-off" : "crosshairs-gps"} size={22} color={noDriver ? v2Theme.colors.warning : RIDE_BLACK} />
                      </View>
                      <View style={styles.flex}>
                        <Text style={styles.eyebrow}>{noDriver ? "NO MATCH YET" : searchCopy.eyebrow}</Text>
                        <Text style={styles.title}>{noDriver ? "No drivers nearby" : searchCopy.title}</Text>
                      </View>
                    </View>

                    <Text style={styles.body}>{noDriver ? "No approved driver accepted in time. Try again in a moment or choose another available ride class." : searchCopy.body}</Text>

                    {!noDriver && trip ? (
                      <View accessibilityLabel={`Driver search active for ${elapsedSeconds} seconds`} style={styles.progressTrack}>
                        <View style={[styles.progressSegment, elapsedSeconds >= 0 && styles.progressSegmentActive]} />
                        <View style={[styles.progressSegment, elapsedSeconds >= 15 && styles.progressSegmentActive]} />
                        <View style={[styles.progressSegment, elapsedSeconds >= 45 && styles.progressSegmentActive]} />
                      </View>
                    ) : null}

                    {trip ? (
                      <View style={styles.routeSummary}>
                        <View style={styles.routeDot} /><Text numberOfLines={1} style={styles.routeText}>{trip.pickup.formatted_address}</Text>
                        <MaterialCommunityIcons name="arrow-right" size={15} color={v2Theme.colors.inkTertiary} />
                        <View style={styles.routeSquare} /><Text numberOfLines={1} style={styles.routeText}>{trip.dropoff.formatted_address}</Text>
                      </View>
                    ) : null}

                    {error ? <AppNotice message={error} actionLabel="Reconnect" onAction={() => void reload()} /> : null}

                    {noDriver ? (
                      <Pressable accessibilityRole="button" onPress={() => router.replace("/(customer)/hail" as never)} style={({ pressed }) => [styles.primary, pressed && styles.pressed]}>
                        <Text style={styles.primaryText}>Try another ride</Text><MaterialCommunityIcons name="arrow-right" size={19} color="#FFFFFF" />
                      </Pressable>
                    ) : (
                      <Pressable accessibilityRole="button" accessibilityLabel="Cancel Ride Now request" disabled={cancelling} onPress={() => void cancel()} style={({ pressed }) => [styles.cancel, cancelling && styles.cancelBusy, pressed && styles.pressed]}>
                        <Text style={styles.cancelText}>{cancelling ? "Cancelling your request…" : "Cancel request"}</Text>
                      </Pressable>
                    )}
                  </View>
                </View>

                <BottomNav role="customer" activeTone="neutral" />
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            root: { flex: 1, backgroundColor: "#ECECE8" },
            topBar: { position: "absolute", left: 16, right: 16, zIndex: 30, elevation: 30, flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: 10 },
            topButton: { width: 48, height: 48, borderRadius: 24, backgroundColor: "rgba(255,255,255,0.97)", borderWidth: StyleSheet.hairlineWidth, borderColor: "rgba(0,0,0,0.10)", alignItems: "center", justifyContent: "center", shadowColor: "#000000", shadowOpacity: 0.10, shadowRadius: 10, shadowOffset: { width: 0, height: 4 }, elevation: 8 },
            liveButton: { width: 48, height: 48, borderRadius: 24, backgroundColor: "rgba(255,255,255,0.97)", borderWidth: StyleSheet.hairlineWidth, borderColor: "rgba(0,0,0,0.10)", alignItems: "center", justifyContent: "center", shadowColor: "#000000", shadowOpacity: 0.10, shadowRadius: 10, shadowOffset: { width: 0, height: 4 }, elevation: 8 },
            liveDot: { position: "absolute", top: 10, right: 10, width: 7, height: 7, borderRadius: 4, backgroundColor: RIDE_BLACK },
            liveDotSyncing: { backgroundColor: "#D39A24" },
            tripPill: { minHeight: 36, maxWidth: 220, paddingHorizontal: 13, borderRadius: 18, backgroundColor: "rgba(17,17,17,0.94)", alignItems: "center", justifyContent: "center" },
            tripPillText: { color: "#FFFFFF", fontSize: 10, fontWeight: "900" },
            sheet: { position: "absolute", left: 10, right: 10, bottom: SHEET_BOTTOM, backgroundColor: "rgba(255,255,255,0.985)", borderRadius: 30, borderWidth: StyleSheet.hairlineWidth, borderColor: "rgba(0,0,0,0.08)", shadowColor: "#000000", shadowOpacity: 0.13, shadowRadius: 22, shadowOffset: { width: 0, height: 10 }, elevation: 12 },
            handle: { width: 42, height: 4, borderRadius: 2, backgroundColor: "#D7D8D5", alignSelf: "center", marginTop: 8 },
            content: { paddingHorizontal: 16, paddingTop: 12, paddingBottom: 16, gap: 12 },
            radar: { height: 106, alignItems: "center", justifyContent: "center", overflow: "hidden" },
            radarRing: { position: "absolute", width: 94, height: 94, borderRadius: 47, borderWidth: 1, borderColor: "rgba(17,17,17,0.46)" },
            radarCar: { width: 48, height: 48, borderRadius: 24, backgroundColor: RIDE_BLACK, alignItems: "center", justifyContent: "center", shadowColor: "#000000", shadowOpacity: 0.16, shadowRadius: 12, shadowOffset: { width: 0, height: 5 }, elevation: 6 },
            statusRow: { flexDirection: "row", alignItems: "center", gap: 11 },
            statusIcon: { width: 44, height: 44, borderRadius: 16, backgroundColor: "#F0F0EE", alignItems: "center", justifyContent: "center" },
            statusIconWarning: { backgroundColor: v2Theme.colors.warningSoft },
            eyebrow: { color: v2Theme.colors.inkTertiary, fontSize: 8, fontWeight: "900", letterSpacing: 1.1 },
            title: { color: v2Theme.colors.ink, fontSize: 22, lineHeight: 26, fontWeight: "900", letterSpacing: -0.55, marginTop: 1 },
            body: { color: v2Theme.colors.inkSecondary, fontSize: 11, lineHeight: 17 },
            progressTrack: { flexDirection: "row", gap: 5 },
            progressSegment: { flex: 1, height: 4, borderRadius: 2, backgroundColor: "#DDDDDA" },
            progressSegmentActive: { backgroundColor: RIDE_BLACK },
            routeSummary: { minHeight: 40, borderRadius: 14, backgroundColor: "#F7F7F5", paddingHorizontal: 10, flexDirection: "row", alignItems: "center", gap: 7 },
            routeDot: { width: 9, height: 9, borderRadius: 5, borderWidth: 2, borderColor: RIDE_BLACK },
            routeSquare: { width: 9, height: 9, borderRadius: 2, backgroundColor: RIDE_BLACK },
            routeText: { flex: 1, color: v2Theme.colors.inkSecondary, fontSize: 9, fontWeight: "700" },
            primary: { minHeight: 52, borderRadius: 18, backgroundColor: RIDE_BLACK, paddingHorizontal: 16, flexDirection: "row", alignItems: "center", justifyContent: "space-between" },
            primaryText: { color: "#FFFFFF", fontSize: 13, fontWeight: "900" },
            cancel: { minHeight: 50, borderRadius: 18, backgroundColor: RIDE_BLACK, alignItems: "center", justifyContent: "center" },
            cancelBusy: { backgroundColor: "#2B2B2B" },
            cancelText: { color: "#FFFFFF", fontSize: 12, fontWeight: "900" },
            flex: { flex: 1 },
            pressed: { opacity: 0.72, transform: [{ scale: 0.995 }] },
          });
          ''')

          # #13 — Zimbabwe-first autocomplete/geocoding: stronger local fallback plus
          # an explicit Zimbabwe address hint and coordinate guard.
          routing = Path("backend/app/services/routing_service.py")
          text = routing.read_text()
          discovery_start = text.index("_ZIMBABWE_DISCOVERY = [")
          discovery_end = text.index("\n]\n\n\nclass RoutingError", discovery_start) + 2
          discovery = '''_ZIMBABWE_DISCOVERY = [
              ("Harare", "Harare, Zimbabwe", -17.824858, 31.053028),
              ("Bulawayo", "Bulawayo, Zimbabwe", -20.149812, 28.585388),
              ("Chitungwiza", "Chitungwiza, Zimbabwe", -18.0127, 31.0756),
              ("Mutare", "Mutare, Zimbabwe", -18.9707, 32.6709),
              ("Gweru", "Gweru, Zimbabwe", -19.4513, 29.8152),
              ("Kwekwe", "Kwekwe, Zimbabwe", -18.9281, 29.8149),
              ("Kadoma", "Kadoma, Zimbabwe", -18.3333, 29.9167),
              ("Masvingo", "Masvingo, Zimbabwe", -20.0744, 30.8328),
              ("Chinhoyi", "Chinhoyi, Zimbabwe", -17.3667, 30.2000),
              ("Marondera", "Marondera, Zimbabwe", -18.1853, 31.5519),
              ("Victoria Falls", "Victoria Falls, Zimbabwe", -17.9243, 25.8560),
              ("Hwange", "Hwange, Zimbabwe", -18.3645, 26.4988),
              ("Kariba", "Kariba, Zimbabwe", -16.5167, 28.8000),
              ("Bindura", "Bindura, Zimbabwe", -17.3019, 31.3306),
              ("Beitbridge", "Beitbridge, Zimbabwe", -22.2167, 30.0000),
              ("Zvishavane", "Zvishavane, Zimbabwe", -20.3267, 30.0665),
              ("Redcliff", "Redcliff, Zimbabwe", -19.0333, 29.7833),
              ("Rusape", "Rusape, Zimbabwe", -18.5278, 32.1284),
              ("Chegutu", "Chegutu, Zimbabwe", -18.1302, 30.1407),
              ("Norton", "Norton, Zimbabwe", -17.8833, 30.7000),
              ("Gwanda", "Gwanda, Zimbabwe", -20.9333, 29.0000),
              ("Plumtree", "Plumtree, Zimbabwe", -20.4833, 27.8167),
              ("Shurugwi", "Shurugwi, Zimbabwe", -19.6702, 30.0059),
              ("Chipinge", "Chipinge, Zimbabwe", -20.1883, 32.6236),
              ("Chiredzi", "Chiredzi, Zimbabwe", -21.0500, 31.6667),
              ("Karoi", "Karoi, Zimbabwe", -16.8167, 29.6833),
