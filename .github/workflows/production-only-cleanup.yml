name: Guarded Production-Only Cleanup

on:
  push:
    branches:
      - cleanup/production-only-final3
    paths:
      - .github/workflows/production-only-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/production-only-final3
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply production-only runtime and release-config cleanup
        run: |
          python .github/scripts/production_only_cleanup.py
          python .github/scripts/production_only_test_fix.py
          # Workflow-file housekeeping is applied directly through the GitHub connector.
          git checkout HEAD -- .github/workflows
          rm -f .github/workflows/mobile-production-release.yml

      - name: Remove temporary cleanup scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/production_only_cleanup.py
          rm -f .github/scripts/production_only_test_fix.py
          git diff --check

      - name: Assert production-only runtime and EAS configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const eas = require('./mobile/eas.json');
          const builds = Object.keys(eas.build || {});
          if (JSON.stringify(builds) !== JSON.stringify(['production'])) throw new Error(`Unexpected EAS build profiles: ${builds.join(', ')}`);
          if (eas.build.production.env.EXPO_PUBLIC_API_BASE_URL !== 'https://letsgoride-v2-production.onrender.com') throw new Error('Production API mismatch');
          if (eas.submit.production.android.track !== 'production') throw new Error('Android track mismatch');
          if (eas.submit.production.android.releaseStatus !== 'completed') throw new Error('Android release status mismatch');
          if (eas.submit.production.ios.ascAppId !== '6772862281') throw new Error('iOS App Store Connect ID mismatch');
          NODE
          test ! -e backend/app/services/staging_routing_smoke_service.py
          test ! -e backend/app/services/staging_courier_dispatch_smoke_service.py
          test ! -e mobile/__tests__/testflight-staging-profile.test.ts
          test -e mobile/__tests__/production-only-release-profile.test.ts
          if grep -R -n -E 'letsgoride-v2-staging\.onrender\.com|ENABLE_DEMO_SEED|ALLOW_STAGING_|ROUTING_STAGING_SMOKE_TEST_ENABLED|COURIER_DISPATCH_STAGING_SMOKE_TEST_ENABLED' \
            README.md mobile/eas.json backend/app; then
            echo 'Active staging/demo runtime configuration remains' >&2
            exit 1
          fi

      - name: Validate backend completely
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
          python -m pip install --disable-pip-version-check -q 'pytest>=8,<9' 'pytest-asyncio>=0.24,<1'
          python -m compileall -q backend/app backend/scripts backend/tests
          cd backend
          python -c "from app.main import app; assert app.title == 'LetsGoRide API'"
          python -m pytest tests -q

      - name: Validate mobile completely
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npm ci --no-audit --no-fund
          npm audit --audit-level=critical
          npm run typecheck
          npm test -- --runInBand
          npm run verify:android

      - name: Commit validated production-only runtime tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "deonvault-crypto"
          git config user.email "deonvault@gmail.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --diff-filter=ACMR --name-only | grep -E '^\.github/scripts/production_only_'; then
            echo 'Temporary cleanup script would remain in candidate tree' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
            echo 'Workflow-file change leaked into runner commit' >&2
            exit 1
          fi
          git commit -m "chore: make LetsGoRide runtime production-only"
          git push origin HEAD:cleanup/production-only-final3
