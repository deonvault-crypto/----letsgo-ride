name: Platform V2 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - platform-v2-m1-m6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        shell: bash
        run: |
          set -uo pipefail
          while IFS= read -r test_file; do
            echo "=== RUNNING ${test_file} ==="
            if timeout 60s npx jest --runTestsByPath "$test_file" --runInBand --verbose --detectOpenHandles --testTimeout=15000; then
              echo "=== PASSED ${test_file} ==="
            else
              status=$?
              if [ "$status" -eq 124 ]; then
                echo "::error file=${test_file}::Test file timed out after 60 seconds"
              else
                echo "::error file=${test_file}::Test file failed with exit code ${status}"
              fi
              exit "$status"
            fi
          done < <(find __tests__ -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)

  backend:
    name: Backend import, syntax and service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python package
        run: python -m compileall -q app scripts tests

      - name: Import API application
        env:
          ENABLE_DEMO_SEED: "false"
        run: python -c "from app.main import app; assert app.title == 'LetsGoRide API'"

      - name: Platform V2 service tests
        env:
          ENABLE_DEMO_SEED: "false"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
