name: Platform V2 CI

on:
  push:
    branches:
      - platform-v2-m1-m6
  pull_request:
    branches:
      - main

jobs:
  mobile:
    name: Mobile typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

  backend:
    name: Backend import, syntax and service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python package
        run: python -m compileall -q app tests

      - name: Import API application
        env:
          ENABLE_DEMO_SEED: "false"
        run: python -c "from app.main import app; assert app.title == 'LetsGoRide API'"

      - name: Platform V2 service tests
        env:
          ENABLE_DEMO_SEED: "false"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
