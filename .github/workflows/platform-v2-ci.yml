name: Platform V2 CI

on:
  pull_request:
    branches:
      - main
      - platform-v2-m1-m6
  push:
    branches:
      - main
      - platform-v2-m1-m6
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep push and PR runs in separate lanes. The platform PR's jobs are skipped
  # below, while exact integration/release branch pushes remain authoritative.
  group: platform-v2-ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  regenerate-postcss-lock:
    name: Regenerate patched PostCSS lock once
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/2.0.2-final-consolidation' && github.event.head_commit.message == 'Prepare one-time PostCSS lock regeneration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with parent
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Generate canonical PostCSS override lock
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npm pkg set overrides.postcss=8.5.26
          npm install --ignore-scripts
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const postcss = lock.packages?.['node_modules/postcss'];
          if (!postcss || postcss.version !== '8.5.26') {
            throw new Error(`Expected postcss@8.5.26 in lockfile, got ${postcss?.version || 'missing'}`);
          }
          console.log(`Resolved postcss@${postcss.version}`);
          NODE
          npm audit --omit=dev || true
          cd ..
          # The generated commit must restore the normal read-only CI workflow.
          git checkout HEAD^ -- .github/workflows/platform-v2-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json .github/workflows/platform-v2-ci.yml
          git diff --cached --check
          git commit -m "Pin patched PostCSS for Expo 54"
          git push --force origin HEAD:refs/heads/automation/postcss-8.5.26

  mobile:
    name: Mobile typecheck and tests
    # Skip only the one-time lock-generation commit. The generated release commit
    # is validated later on its exact SHA through this normal job.
    if: (github.event_name != 'push' || github.event.head_commit.message != 'Prepare one-time PostCSS lock regeneration') && (github.event_name != 'pull_request' || github.head_ref != 'platform-v2-m1-m6')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Classify npm audit findings without mutating dependencies
        shell: bash
        run: |
          set -uo pipefail
          npm audit --json > /tmp/npm-audit-full.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');

          const severityRank = { critical: 0, high: 1, moderate: 2, low: 3, info: 4 };

          function summarize(path, label) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const metadata = report.metadata?.vulnerabilities || {};
            const vulnerabilities = report.vulnerabilities || {};
            console.log(`=== NPM AUDIT ${label} SUMMARY ===`);
            console.log(JSON.stringify(metadata));

            const rows = Object.entries(vulnerabilities)
              .map(([name, item]) => ({
                name,
                severity: item.severity,
                direct: Boolean(item.isDirect),
                range: item.range,
                via: (item.via || []).map((entry) => typeof entry === 'string' ? entry : entry.name),
                effects: item.effects || [],
                fixAvailable: item.fixAvailable,
              }))
              .sort((a, b) => (severityRank[a.severity] ?? 99) - (severityRank[b.severity] ?? 99) || a.name.localeCompare(b.name));

            for (const row of rows) {
              console.log(`AUDIT_ITEM ${label} ${JSON.stringify(row)}`);
            }
            return Number(metadata.critical || 0);
          }

          const fullCritical = summarize('/tmp/npm-audit-full.json', 'FULL');
          const prodCritical = summarize('/tmp/npm-audit-prod.json', 'PRODUCTION');
          if (fullCritical > 0 || prodCritical > 0) {
            console.error('Critical npm vulnerability detected; failing closed.');
            process.exit(1);
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Android API and release policy
        run: npm run verify:android

      - name: Unit tests
        shell: bash
        run: |
          set -uo pipefail
          while IFS= read -r test_file; do
            echo "=== RUNNING ${test_file} ==="
            if timeout 60s npx jest --runTestsByPath "$test_file" --runInBand --verbose --detectOpenHandles --testTimeout=15000; then
              echo "=== PASSED ${test_file} ==="
            else
              status=$?
              if [ "$status" -eq 124 ]; then
                echo "::error file=${test_file}::Test file timed out after 60 seconds"
              else
                echo "::error file=${test_file}::Test file failed with exit code ${status}"
              fi
              exit "$status"
            fi
          done < <(find __tests__ -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)

  backend:
    name: Backend import, syntax and service tests
    # Skip only the one-time lock-generation commit. The generated release commit
    # is validated later on its exact SHA through this normal job.
    if: (github.event_name != 'push' || github.event.head_commit.message != 'Prepare one-time PostCSS lock regeneration') && (github.event_name != 'pull_request' || github.head_ref != 'platform-v2-m1-m6')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python package
        run: python -m compileall -q app scripts tests

      - name: Import API application
        env:
          ENABLE_DEMO_SEED: "false"
        run: python -c "from app.main import app; assert app.title == 'LetsGoRide API'"

      - name: Platform V2 service tests
        env:
          ENABLE_DEMO_SEED: "false"
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  production-smoke:
    name: Production API and legal surface smoke
    if: github.ref == 'refs/heads/platform-v2-m1-m6' || github.head_ref == 'platform-v2-m1-m6'
    needs:
      - mobile
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_ORIGIN: https://letsgoride-v2-production.onrender.com
      SITE_ORIGIN: https://letsgoride.site
    steps:
      - name: Verify production liveness and Mongo readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$API_ORIGIN/health/live" -o /tmp/live.json
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$API_ORIGIN/health/ready" -o /tmp/ready.json
          python - <<'PY'
          import json
          with open('/tmp/live.json', encoding='utf-8') as handle:
              live = json.load(handle)
          with open('/tmp/ready.json', encoding='utf-8') as handle:
              ready = json.load(handle)
          assert live.get('success') is True, live
          assert live.get('data', {}).get('status') == 'alive', live
          assert ready.get('success') is True, ready
          assert ready.get('data', {}).get('status') == 'ready', ready
          assert ready.get('data', {}).get('database_status') == 'connected', ready
          PY

      - name: Verify production Resend and Google routing configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$API_ORIGIN/health/email-config" -o /tmp/email.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"query":"Harare"}' \
            "$API_ORIGIN/routing/places/autocomplete" \
            -o /tmp/routing.json
          python - <<'PY'
          import json
          with open('/tmp/email.json', encoding='utf-8') as handle:
              email = json.load(handle)
          with open('/tmp/routing.json', encoding='utf-8') as handle:
              routing = json.load(handle)
          assert email.get('provider') == 'resend', email
          assert email.get('configured') is True, email
          assert routing.get('success') is True, routing
          results = routing.get('data')
          assert isinstance(results, list) and results, routing
          PY

      - name: Verify production docs are disabled
        shell: bash
        run: |
          set -euo pipefail
          for path in docs openapi.json redoc; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$API_ORIGIN/$path")"
            test "$code" = "404"
          done

      - name: Verify trusted production CORS
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -X OPTIONS \
            -H "Origin: $SITE_ORIGIN" \
            -H "Access-Control-Request-Method: GET" \
            -D /tmp/cors-headers.txt \
            -o /dev/null \
            "$API_ORIGIN/health/live"
          tr -d '\r' < /tmp/cors-headers.txt | grep -Fi "access-control-allow-origin: $SITE_ORIGIN"

      - name: Verify public store-compliance URLs
        shell: bash
        run: |
          set -euo pipefail
          for path in privacy terms support safety delete-account; do
            echo "Checking $SITE_ORIGIN/$path"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$SITE_ORIGIN/$path" -o "/tmp/${path}.html"
            grep -qi "LetsGoRide" "/tmp/${path}.html"
          done
          grep -qi "Delete your LetsGoRide account" /tmp/delete-account.html
