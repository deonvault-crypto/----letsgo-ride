name: Add Expo splash dependency

on:
  push:
    branches:
      - feat/premium-launch-intro
    paths:
      - .github/workflows/add-launch-splash-dependency.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/premium-launch-intro
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install current dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add SDK-compatible splash package
        working-directory: mobile
        run: npx expo install expo-splash-screen --npm

      - name: Verify exact dependency scope
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pkg = require('./mobile/package.json');
          const lock = require('./mobile/package-lock.json');
          if (pkg.dependencies['expo-splash-screen'] !== '~31.0.13') {
            throw new Error(`Unexpected expo-splash-screen range: ${pkg.dependencies['expo-splash-screen']}`);
          }
          if (lock.packages['node_modules/expo-splash-screen']?.version !== '31.0.13') {
            throw new Error(`Unexpected resolved expo-splash-screen version: ${lock.packages['node_modules/expo-splash-screen']?.version}`);
          }
          NODE
          changed="$(git diff --name-only)"
          test "$changed" = $'mobile/package-lock.json\nmobile/package.json' || {
            echo "Unexpected files changed by expo install:"
            printf '%s\n' "$changed"
            exit 1
          }

      - name: Commit dependency files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package.json mobile/package-lock.json
          git commit -m 'chore(mobile): add Expo splash screen'
          git push origin HEAD:feat/premium-launch-intro
