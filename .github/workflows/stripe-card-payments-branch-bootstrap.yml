name: Stripe Card Payments Branch Bootstrap

on:
  push:
    branches:
      - stripe-card-payments-v1
    paths:
      - scripts/apply_stripe_card_payments_v1.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stripe-card-payments-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply Stripe integration patches
        run: python scripts/apply_stripe_card_payments_v1.py

      - name: Install Expo-compatible Stripe React Native SDK
        working-directory: mobile
        run: npm install --save-exact @stripe/stripe-react-native@0.50.3

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app tests

      - name: Run backend service tests
        working-directory: backend
        env:
          ENABLE_DEMO_SEED: "false"
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Commit generated integration and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend mobile
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Implement Stripe card authorization for Ride Now"
          git push origin HEAD:stripe-card-payments-v1
