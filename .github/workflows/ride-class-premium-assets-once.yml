name: Ride Class Premium Assets Once

on:
  push:
    branches:
      - fix/product-polish-batch-production-v2

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product polish branch
        uses: actions/checkout@v4
        with:
          ref: fix/product-polish-batch-production-v2
          fetch-depth: 0

      - name: Apply exact Ride Now card polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/app/(customer)/hail/index.tsx')
          text = path.read_text()

          replacements = {
              '<RideClassCar rideClass={option.id} disabled={optionDisabled} />': '<RideClassCar rideClass={option.id} disabled={optionDisabled} selected={selected} />',
              '  classRail: { gap: 8, paddingRight: 4 },': '  classRail: { gap: 7, paddingRight: 4 },',
              '  classCard: { width: 108, minHeight: 100, borderRadius: 18, backgroundColor: "#F6F6F4", borderWidth: StyleSheet.hairlineWidth, borderColor: v2Theme.colors.lineStrong, padding: 8, alignItems: "center", justifyContent: "center" },': '  classCard: { width: 110, minHeight: 114, borderRadius: 19, backgroundColor: "#F6F6F4", borderWidth: StyleSheet.hairlineWidth, borderColor: v2Theme.colors.lineStrong, paddingHorizontal: 6, paddingTop: 8, paddingBottom: 10, alignItems: "center", justifyContent: "center" },',
              '  classCardSelected: { backgroundColor: RIDE_BLACK, borderColor: RIDE_BLACK },': '  classCardSelected: { backgroundColor: RIDE_BLACK, borderColor: "rgba(84,199,121,0.30)", shadowColor: "#54C779", shadowOpacity: 0.16, shadowRadius: 12, shadowOffset: { width: 0, height: 4 }, elevation: 4 },',
              '  className: { color: v2Theme.colors.ink, fontSize: 11, fontWeight: "900", marginTop: -1 },': '  className: { color: v2Theme.colors.ink, fontSize: 11, fontWeight: "900", marginTop: -2 },',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected Ride Now source fragment: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Run ride visual contract
        working-directory: mobile
        run: npm test -- --runInBand __tests__/ride-class-visual-contract.test.ts

      - name: Run full mobile regression suite
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Commit validated Ride Now visual upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "letsgoride-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'mobile/app/(customer)/hail/index.tsx'
          git rm '.github/workflows/ride-class-premium-assets-once.yml'
          git diff --cached --check
          git commit -m "Polish Ride Now premium vehicle cards"
          git push origin HEAD:fix/product-polish-batch-production-v2
