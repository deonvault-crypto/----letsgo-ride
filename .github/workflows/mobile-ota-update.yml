name: LetsGoRide Reviewed App Update
on:
  workflow_dispatch:
    inputs:
      message:
        description: Release notes for this reviewed update
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: letsgoride-production-ota
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/platform-v2-m1-m6' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Require green CI on the exact production source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/actions/runs?head_sha=' + process.env.GITHUB_SHA + '&per_page=20', {
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
              signal: AbortSignal.timeout(30000)
            });
            if (!response.ok) throw new Error('Cannot verify production CI.');
            const runs = (await response.json()).workflow_runs.filter(run => run.name === 'LetsGoRide Production CI' && run.event === 'push' && run.head_sha === process.env.GITHUB_SHA).sort((a, b) => b.id - a.id);
            if (runs[0]?.conclusion !== 'success') throw new Error('Exact production CI must pass before publishing.');
            const app = require('./app.json').expo;
            if (app.runtimeVersion?.policy !== 'fingerprint' || app.updates?.url !== 'https://u.expo.dev/6a3f6705-1e96-4f17-b884-b928baebf0ba') throw new Error('Update compatibility configuration changed.');
            console.log('Verified exact production source and fingerprint compatibility.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Match the production build environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const env = require('./eas.json').build.production.env;
          const expected = {
            EXPO_PUBLIC_API_BASE_URL: 'https://letsgoride-v2-production.onrender.com',
            EXPO_PUBLIC_ENABLE_AUTHENTICATED_WEB: 'false',
          };
          for (const [name, value] of Object.entries(expected)) {
            if (env[name] !== value) throw new Error('Review production setting: ' + name);
            fs.appendFileSync(process.env.GITHUB_ENV, name + '=' + value + '\n');
            process.env[name] = value;
          }
          const check = require('node:path').join(process.env.RUNNER_TEMP, 'verify-update-environment.cjs');
          fs.writeFileSync(check, `const expected = ${JSON.stringify(expected)};\nfor (const [name, value] of Object.entries(expected)) { if (process.env[name] !== value) throw new Error('Update environment differs from store builds: ' + name); }\nconsole.log('Production API and authentication settings match the store builds.');\n`);
          require('node:child_process').execFileSync('npx', ['--yes', 'eas-cli@23.2.0', 'env:exec', 'production', 'node "' + check + '"', '--non-interactive'], { stdio: 'inherit', env: process.env });
          NODE
      - name: Publish compatible changes for the next app launch
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_MESSAGE: ${{ inputs.message }}
        run: npx --yes eas-cli@23.2.0 update --channel production --environment production --message "$RELEASE_MESSAGE" --non-interactive
