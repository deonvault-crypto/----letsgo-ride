name: LetsGoRide Support Lifecycle iOS TestFlight

on:
  push:
    branches:
      - build/support-lifecycle-ios-testflight-20260913
    paths:
      - .github/workflows/support-lifecycle-ios-testflight.yml

permissions:
  contents: read

concurrency:
  group: support-lifecycle-ios-testflight-20260913
  cancel-in-progress: false

jobs:
  build-and-submit-ios:
    runs-on: macos-15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scoped source changes
        run: |
          git diff --exit-code 5d14c9677cc9e98425aae216719fbb6899e0133c HEAD -- mobile ":(exclude)mobile/package.json" ":(exclude)mobile/scripts/patch-stripe-xcode26.js"
          node -e "const a=require('./mobile/app.json'); if(a.expo.version!=='2.0.4') throw new Error('Expected 2.0.4'); if(a.expo.ios.bundleIdentifier!=='co.zw.letsgoride') throw new Error('Unexpected bundle id');"
          node -e "const p=require('./mobile/package.json'); if(p.dependencies['@stripe/stripe-react-native']!=='0.50.3') throw new Error('Stripe version changed unexpectedly'); if(p.scripts['eas-build-post-install']!=='node scripts/patch-stripe-xcode26.js') throw new Error('Missing scoped Xcode 26 patch hook');"
          test -f mobile/scripts/patch-stripe-xcode26.js

      - name: Pin Apple-accepted Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build signed iOS IPA locally
        working-directory: mobile
        run: npx eas-cli@24.3.0 build --platform ios --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/letsgoride-support-ios-204.ipa"

      - name: Submit IPA to App Store Connect TestFlight
        working-directory: mobile
        run: npx eas-cli@24.3.0 submit --platform ios --profile production --path "$GITHUB_WORKSPACE/letsgoride-support-ios-204.ipa" --non-interactive

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letsgoride-support-ios-204
          path: letsgoride-support-ios-204.ipa
          if-no-files-found: warn
          retention-days: 7
