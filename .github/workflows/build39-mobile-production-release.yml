name: Build39 Mobile Production Release

on:
  push:
    branches:
      - release/build39-mobile-production
    paths:
      - .github/workflows/build39-mobile-production-release.yml

permissions:
  contents: read

concurrency:
  group: build39-mobile-production-release
  cancel-in-progress: false

jobs:
  validate-release-source:
    name: Validate exact Build39 production source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove app source matches validated production head
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 3c03c914dedbff534e91678afe97331fa96e96d3^{commit}
          mapfile -t changed < <(git diff --name-only 3c03c914dedbff534e91678afe97331fa96e96d3...HEAD | sort)
          printf 'Release-only changes:\n%s\n' "${changed[*]}"
          expected=$'.github/workflows/build39-mobile-production-release.yml\nmobile/eas.json'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Verify production-only EAS release contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const eas = require('./eas.json');
          const app = require('./app.json');
          const prod = 'https://letsgoride-v2-production.onrender.com';
          if (app.expo.version !== '2.0.2') throw new Error(`Unexpected app version: ${app.expo.version}`);
          if (app.expo.android.package !== 'com.letsgo.ride') throw new Error('Android package changed');
          if (app.expo.ios.bundleIdentifier !== 'co.zw.letsgoride') throw new Error('iOS bundle identifier changed');
          if (eas.build.production.env.EXPO_PUBLIC_API_BASE_URL !== prod) throw new Error('Production build is not pinned to production API');
          if (eas.build.production.android.buildType !== 'app-bundle') throw new Error('Android production build must be AAB');
          if (eas.submit.production.android.track !== 'production') throw new Error('Android submit track must be production');
          if (eas.submit.production.android.releaseStatus !== 'completed') throw new Error('Android release status must be completed');
          if (eas.submit.production.ios.ascAppId !== '6772862281') throw new Error('Unexpected App Store Connect app ID');
          NODE

      - name: Reject critical dependency findings
        shell: bash
        run: npm audit --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Run complete mobile test suite
        run: npm test -- --runInBand

      - name: Verify Android production configuration
        run: npm run verify:android

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest whoami --non-interactive

  android-production:
    name: Build and submit Android production
    needs: validate-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Build AAB and submit to Google Play production track
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx eas-cli@latest build
          --platform android
          --profile production
          --auto-submit-with-profile production
          --non-interactive
          --message "LetsGoRide 2.0.2 Build39 production release"

  ios-production-candidate:
    name: Build and upload iOS App Store candidate
    needs: validate-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Build production iOS and upload to App Store Connect
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx eas-cli@latest build
          --platform ios
          --profile production
          --auto-submit-with-profile production
          --non-interactive
          --message "LetsGoRide 2.0.2 Build39 production release"
