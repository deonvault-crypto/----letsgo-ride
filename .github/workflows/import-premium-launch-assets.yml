name: Import premium launch assets

on:
  push:
    branches:
      - feat/premium-launch-intro
    paths:
      - .github/workflows/import-premium-launch-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/premium-launch-intro
          fetch-depth: 0

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow numpy

      - name: Build the approved layered launch artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/assets/branding /tmp/letsgoride-launch

          curl --fail --location --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JCPOLC91AGSHolZkdVov39uU0k/6670fd95-6300-413a-b045-46a8ee4bd7cd.jpg' \
            --output /tmp/letsgoride-launch/approved.jpg
          echo '896ad2b5ed8894ce3b66b2cdc3ab2c3f3b2081e3612531ecfbe84731f494d9ba  /tmp/letsgoride-launch/approved.jpg' | sha256sum --check --strict

          curl --fail --location --retry 3 \
            'https://d8j0ntlcm91z4.cloudfront.net/user_3JCPOLC91AGSHolZkdVov39uU0k/hf_20260912_000141_7ab76685-b20b-471f-9ca3-e7d1462192f6.png' \
            --output /tmp/letsgoride-launch/clean.png
          echo 'e61260f87141abec5f6c60b2ba8514554e43f0bc16fdbd8280e2eb1891021bd0  /tmp/letsgoride-launch/clean.png' | sha256sum --check --strict

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import numpy as np

          out_dir = Path('mobile/assets/branding')
          approved = Image.open('/tmp/letsgoride-launch/approved.jpg').convert('RGB')
          if approved.size != (864, 1536):
              raise SystemExit(f'Unexpected approved artwork dimensions: {approved.size}')

          clean = Image.open('/tmp/letsgoride-launch/clean.png').convert('RGB')
          target_ratio = 9 / 16
          current_ratio = clean.width / clean.height
          if current_ratio > target_ratio:
              target_width = round(clean.height * target_ratio)
              left = (clean.width - target_width) // 2
              clean = clean.crop((left, 0, left + target_width, clean.height))
          elif current_ratio < target_ratio:
              target_height = round(clean.width / target_ratio)
              top = (clean.height - target_height) // 2
              clean = clean.crop((0, top, clean.width, top + target_height))
          clean = clean.resize((864, 1536), Image.Resampling.LANCZOS)
          clean.save(out_dir / 'intro-bg.jpg', 'JPEG', quality=88, optimize=True, progressive=True)

          arr = np.asarray(approved).astype(np.float32)
          r, g, b = arr[..., 0], arr[..., 1], arr[..., 2]
          mx, mn = arr.max(axis=2), arr.min(axis=2)
          lum = 0.2126 * r + 0.7152 * g + 0.0722 * b
          chroma = mx - mn
          white_score = np.clip((lum - 150) / 95, 0, 1) * np.clip((75 - chroma) / 65, 0, 1)
          green_score = np.clip((g - r - 15) / 100, 0, 1) * np.clip((g - b - 10) / 100, 0, 1) * np.clip((g - 80) / 150, 0, 1)
          alpha = np.maximum(white_score, green_score)
          alpha = np.clip((alpha - 0.12) / 0.70, 0, 1)
          is_green = green_score > white_score

          def build_layer(name, x0, y0, x1, y1):
              region = np.zeros((approved.height, approved.width), dtype=bool)
              region[y0:y1, x0:x1] = True
              rgba = np.zeros((approved.height, approved.width, 4), dtype=np.uint8)
              rgba[..., :3] = 255
              rgba[is_green, :3] = np.array([32, 217, 90], dtype=np.uint8)
              rgba[..., 3] = (alpha * 255 * region).astype(np.uint8)
              layer = Image.fromarray(rgba, 'RGBA')
              layer.putalpha(layer.getchannel('A').filter(ImageFilter.GaussianBlur(0.3)))
              layer.save(out_dir / name, optimize=True)
              return layer

          wordmark_layer = build_layer('intro-wordmark.png', 95, 395, 775, 555)
          build_layer('intro-subcopy.png', 150, 545, 730, 720)
          build_layer('intro-tagline.png', 200, 1350, 690, 1425)

          wordmark = wordmark_layer.crop((95, 395, 775, 555))
          bbox = wordmark.getbbox()
          if not bbox:
              raise SystemExit('Could not extract LetsGoRide wordmark')
          wordmark = wordmark.crop(bbox)
          target_width = 820
          target_height = round(wordmark.height * target_width / wordmark.width)
          wordmark = wordmark.resize((target_width, target_height), Image.Resampling.LANCZOS)
          splash = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          splash.alpha_composite(wordmark, ((1024 - target_width) // 2, (1024 - target_height) // 2))
          splash.save(out_dir / 'native-splash-logo.png', optimize=True)

          checks = {
              'intro-bg.jpg': Image.open(out_dir / 'intro-bg.jpg').size,
              'intro-wordmark.png': Image.open(out_dir / 'intro-wordmark.png').size,
              'intro-subcopy.png': Image.open(out_dir / 'intro-subcopy.png').size,
              'intro-tagline.png': Image.open(out_dir / 'intro-tagline.png').size,
              'native-splash-logo.png': Image.open(out_dir / 'native-splash-logo.png').size,
          }
          expected = {
              'intro-bg.jpg': (864, 1536),
              'intro-wordmark.png': (864, 1536),
              'intro-subcopy.png': (864, 1536),
              'intro-tagline.png': (864, 1536),
              'native-splash-logo.png': (1024, 1024),
          }
          if checks != expected:
              raise SystemExit(f'Launch asset verification failed: {checks}')
          print('launch assets verified:', checks)
          PY

      - name: Commit exact launch assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/assets/branding/intro-bg.jpg \
            mobile/assets/branding/intro-wordmark.png \
            mobile/assets/branding/intro-subcopy.png \
            mobile/assets/branding/intro-tagline.png \
            mobile/assets/branding/native-splash-logo.png
          if git diff --cached --quiet; then
            echo 'Launch assets already match; nothing to commit.'
            exit 0
          fi
          git commit -m 'feat(mobile): split premium launch typography'
          git push origin HEAD:feat/premium-launch-intro
