name: EAS TestFlight Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'testflight/production-2.0.2'

permissions:
  contents: read

concurrency:
  group: eas-testflight-release
  cancel-in-progress: false

jobs:
  queue-testflight:
    name: Queue iOS TestFlight build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify exact production release trigger
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "testflight/production-2.0.2" ]; then
            echo "Unexpected TestFlight push trigger: ${GITHUB_REF_NAME}"
            exit 1
          fi
          git rev-parse HEAD

      - name: Install dependencies
        run: npm ci

      - name: Verify release API target and Android policy
        run: |
          node -e "const eas=require('./eas.json'); const p='https://letsgoride-v2-production.onrender.com'; if(eas.build.testflight.env.EXPO_PUBLIC_API_BASE_URL !== p || eas.build.production.env.EXPO_PUBLIC_API_BASE_URL !== p) process.exit(1)"
          npm run typecheck
          npm run verify:android

      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required for the TestFlight release workflow."
            exit 1
          fi

      - name: Build and submit exact release to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx eas-cli@latest build
          --platform ios
          --profile testflight
          --auto-submit-with-profile production
          --non-interactive
          --no-wait
          --message "LetsGoRide 2.0.2 production hardening: admin, vehicles, weekly settlement, realtime reliability"
