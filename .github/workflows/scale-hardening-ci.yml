name: Scale Hardening CI

on:
  push:
    branches:
      - hardening/scale-production-prelaunch
  pull_request:
    branches:
      - platform-v2-m1-m6

permissions:
  contents: read

concurrency:
  group: scale-hardening-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend scale and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall app
      - name: Import API
        run: python -c "import app.main"
      - name: Full backend tests
        run: python -m pytest -q

  mobile:
    name: Mobile regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Android release verification
        run: npm run verify:android
      - name: Unit tests
        run: npm test -- --runInBand
