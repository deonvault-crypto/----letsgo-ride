name: LetsGoRide Support Lifecycle iOS Local Build

on:
  push:
    branches:
      - build/support-lifecycle-binaries-20260913
    paths:
      - .github/workflows/support-lifecycle-ios-local-build.yml

permissions:
  contents: read

concurrency:
  group: support-lifecycle-ios-local-build-20260913
  cancel-in-progress: false

jobs:
  build-ios-locally:
    runs-on: macos-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify mobile source is identical to merged production
        run: git diff --exit-code e92a67fdd30a6533bc8250cdef78e5fa221108a0 HEAD -- mobile

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build signed iOS IPA locally
        working-directory: mobile
        run: npx eas-cli@24.3.0 build --platform ios --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/letsgoride-support-ios.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: letsgoride-support-ios
          path: letsgoride-support-ios.ipa
          if-no-files-found: error
          retention-days: 7
