name: LetsGoRide iOS Build 46 TestFlight Submit

on:
  push:
    branches:
      - build/launch-intro-binaries-20260912
    paths:
      - .github/workflows/launch-intro-build-only.yml

permissions:
  contents: read

jobs:
  submit-ios:
    name: Submit existing iOS Build 46 to App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Verify exact iOS build is finished
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build:view 8a8b56b5-4c37-4c94-83a8-e3d69c14191d --json
      - name: Submit iOS Build 46 to App Store Connect TestFlight only
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest submit --platform ios --profile production --id 8a8b56b5-4c37-4c94-83a8-e3d69c14191d --non-interactive
