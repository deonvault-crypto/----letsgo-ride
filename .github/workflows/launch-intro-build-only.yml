name: LetsGoRide Launch Intro Build Status

on:
  push:
    branches:
      - build/launch-intro-binaries-20260912
    paths:
      - .github/workflows/launch-intro-build-only.yml

permissions:
  contents: read

jobs:
  status:
    name: Check EAS build statuses only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Android build status
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build:view 670f21e6-e2c9-484e-8c03-f1445f73d63d --json
      - name: iOS build status
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build:view 8a8b56b5-4c37-4c94-83a8-e3d69c14191d --json
