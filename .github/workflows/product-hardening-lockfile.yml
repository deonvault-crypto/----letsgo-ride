name: Product hardening lockfile sync

on:
  push:
    branches:
      - product-hardening-1-13
    paths:
      - .github/workflows/product-hardening-lockfile.yml
      - mobile/package.json

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: product-hardening-1-13

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate deterministic mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git rm .github/workflows/product-hardening-lockfile.yml
          git commit -m "chore(mobile): sync background-location dependency lockfile"
          git push origin HEAD:product-hardening-1-13
