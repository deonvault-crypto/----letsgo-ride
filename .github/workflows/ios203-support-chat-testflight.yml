name: LetsGoRide iOS 2.0.3 Status Only
on:
  push:
    branches:
      - build/ios203-support-chat-testflight
    paths:
      - .github/workflows/ios203-support-chat-testflight.yml
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read finished build and submission only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const query = 'query { builds { byId(buildId: "c967f784-fb5f-43cf-ad4e-b50c388d020f") { id status platform appVersion appBuildVersion } } submissions { byId(submissionId: "06b72541-9049-46d0-935f-9701ef941ff1") { id status error { errorCode message } } } }';
            const response = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', authorization: 'Bearer ' + process.env.EXPO_TOKEN },
              body: JSON.stringify({ query }),
              signal: AbortSignal.timeout(30000)
            });
            const data = await response.json();
            if (!response.ok || data.errors) throw new Error(JSON.stringify(data.errors || { status: response.status }));
            console.log(JSON.stringify(data.data));
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
