name: Android v26 Internal Verification

on:
  push:
    branches:
      - build/android-v26-internal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android production-profile AAB only
    if: github.ref == 'refs/heads/build/android-v26-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BASE_SHA: 96b09ef29a4dcbda765326e4ff4f6cfc4f083848
    steps:
      - name: Checkout exact build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove mobile source matches merged platform SHA
        run: git diff --exit-code "$BASE_SHA" -- .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Verify Android release configuration
        run: npm run verify:android

      - name: Verify Expo authentication
        run: npx eas-cli@latest whoami --non-interactive

      - name: Start Android production-profile build without submission
        run: npx eas-cli@latest build --platform android --profile production --environment production --non-interactive --no-wait
