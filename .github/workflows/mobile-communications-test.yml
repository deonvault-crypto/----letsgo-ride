name: LetsGoRide Communications Test Builds
on:
  push:
    branches: [build/mobile-communications-test]
    paths: [.github/workflows/mobile-communications-test.yml]
permissions:
  contents: read
jobs:
  status:
    name: Completed builds — status only
    runs-on: ubuntu-latest
    steps:
      - name: Report recorded outcomes without creating builds
        run: |
          echo 'iOS 2.0.3 (45): TestFlight available, b20e6841-1eef-44fb-bb95-1529b9946135'
          echo 'Android 2.0.3 (29): failed fingerprint compatibility check, 46508cc7-a80d-4720-9ad6-73ac66eafd02'
          echo 'Build and submission commands are disabled in this completed helper.'
