name: Android Build 17 Diagnostic

on:
  push:
    branches:
      - release/2.0.2-final-consolidation
    paths:
      - .github/workflows/android-build17-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect failed EAS Android build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Android Build 17 diagnostics only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          rm -rf /tmp/eas17-before /tmp/eas17-after
          mkdir -p /tmp/eas17-before /tmp/eas17-after
          find . -maxdepth 2 -type f -printf '%p\n' | sort > /tmp/eas17-before/files.txt
          set +e
          npx eas-cli@latest build:download \
            --build-id 38f6bc42-d78c-40cb-835e-b076701e2aa2 \
            --all-artifacts \
            --non-interactive 2>&1 | tee /tmp/eas17-download.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "download_exit_code=$status"
          find . -maxdepth 4 -type f -printf '%p\n' | sort > /tmp/eas17-after/files.txt
          echo '=== newly downloaded files ==='
          comm -13 /tmp/eas17-before/files.txt /tmp/eas17-after/files.txt | sed -E 's#https?://[^ ]+#<url-redacted>#g' || true
          echo '=== relevant diagnostic text ==='
          {
            grep -Eai -C 12 'FAILURE:|What went wrong:|Execution failed for task|A failure occurred while executing|Caused by:|R8:|Duplicate class|Could not resolve|Manifest merger failed|resource shrink|Missing class|ERROR' /tmp/eas17-download.txt || true
            while IFS= read -r file; do
              case "$file" in
                *.log|*.txt|*.json|*.xml|*.html)
                  grep -Eai -C 12 'FAILURE:|What went wrong:|Execution failed for task|A failure occurred while executing|Caused by:|R8:|Duplicate class|Could not resolve|Manifest merger failed|resource shrink|Missing class|ERROR' "$file" || true
                  ;;
              esac
            done < <(comm -13 /tmp/eas17-before/files.txt /tmp/eas17-after/files.txt)
          } | sed -E 's#https?://[^ ]+#<url-redacted>#g' | tail -n 350
          # A failed artifact download should not obscure the useful CLI message.
          exit 0
