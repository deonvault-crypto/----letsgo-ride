name: Temporary cleanup lockfile refresh

on:
  push:
    branches:
      - chore/codebase-cleanup-2026-09
    paths:
      - .github/workflows/codebase-cleanup-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: chore/codebase-cleanup-2026-09
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Remove confirmed dead dependency
        working-directory: mobile
        run: npm uninstall expo-document-picker --package-lock-only --ignore-scripts

      - name: Commit package metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo "No package metadata changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "chore(mobile): remove unused document picker"
          git push origin HEAD:chore/codebase-cleanup-2026-09
