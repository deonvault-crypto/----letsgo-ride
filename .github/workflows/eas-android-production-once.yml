name: EAS Android Gradle Diagnostic

on:
  push:
    branches:
      - automation/android-production-build-14b124b4

permissions:
  contents: read

concurrency:
  group: eas-android-gradle-diagnostic-14b124b4
  cancel-in-progress: false

jobs:
  inspect-gradle-failure:
    name: Extract Gradle failure for 3ce0f3e1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout frozen release candidate
        uses: actions/checkout@v4
        with:
          ref: 14b124b4896c1481325fc8ebaf4fcab009431e83

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"

      - name: Query Expo GraphQL and extract Gradle error
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: 3ce0f3e1-861b-4bfb-ab19-0cfdaa6773b5
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/query.txt <<'GRAPHQL'
          query BuildById($buildId: ID!) {
            builds {
              byId(buildId: $buildId) {
                id
                status
                platform
                error {
                  errorCode
                  message
                  docsUrl
                }
                logFiles
                artifacts {
                  buildUrl
                  applicationArchiveUrl
                  buildArtifactsUrl
                }
                sdkVersion
                appVersion
                appBuildVersion
                gitCommitHash
                createdAt
                completedAt
              }
            }
          }
          GRAPHQL

          jq -n --rawfile query /tmp/query.txt --arg buildId "$BUILD_ID" \
            '{query:$query, variables:{buildId:$buildId}}' > /tmp/request.json

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @/tmp/request.json \
            https://api.expo.dev/graphql > /tmp/response.json

          if jq -e '.errors and (.errors | length > 0)' /tmp/response.json >/dev/null; then
            echo 'Expo GraphQL returned errors:'
            jq '.errors | map({message, extensions})' /tmp/response.json
            exit 1
          fi

          jq '.data.builds.byId | {
            id,
            status,
            platform,
            error,
            sdkVersion,
            appVersion,
            appBuildVersion,
            gitCommitHash,
            createdAt,
            completedAt,
            logFileCount: ((.logFiles // []) | length)
          }' /tmp/response.json

          jq -r '.data.builds.byId.logFiles[]?' /tmp/response.json > /tmp/log-urls.txt
          mkdir -p /tmp/eas-logs
          index=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            curl --fail --silent --show-error --location "$url" -o "/tmp/eas-logs/log-${index}.txt"
            index=$((index + 1))
          done < /tmp/log-urls.txt

          echo "Downloaded ${index} EAS log file(s)."
          echo '=== GRADLE FAILURE EXCERPTS ==='
          if [ "$index" -eq 0 ]; then
            echo 'No log files returned by Expo GraphQL.'
            exit 1
          fi

          grep -RniE -B 20 -A 60 \
            'FAILURE: Build failed|What went wrong|Execution failed for task|Could not resolve|Could not determine|Caused by:|Manifest merger failed|Duplicate class|AAPT2?|resource.*not found|google-services|R8|Kotlin compilation|Gradle build daemon disappeared|BUILD FAILED|error:' \
            /tmp/eas-logs | tail -n 500 || true
