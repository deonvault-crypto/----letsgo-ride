name: EAS Android Gradle Log Decode

on:
  push:
    branches:
      - automation/android-production-build-14b124b4

permissions:
  contents: read

jobs:
  decode-gradle-log:
    name: Decode Gradle failure for 3ce0f3e1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout frozen release candidate
        uses: actions/checkout@v4
        with:
          ref: 14b124b4896c1481325fc8ebaf4fcab009431e83

      - name: Decode Expo build log
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: 3ce0f3e1-861b-4bfb-ab19-0cfdaa6773b5
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"

          cat > /tmp/query.txt <<'GRAPHQL'
          query BuildById($buildId: ID!) {
            builds {
              byId(buildId: $buildId) {
                id
                status
                logFiles
                error { errorCode message }
              }
            }
          }
          GRAPHQL

          jq -n --rawfile query /tmp/query.txt --arg buildId "$BUILD_ID" \
            '{query:$query, variables:{buildId:$buildId}}' > /tmp/request.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @/tmp/request.json \
            https://api.expo.dev/graphql > /tmp/response.json

          url="$(jq -r '.data.builds.byId.logFiles[0] // empty' /tmp/response.json)"
          test -n "$url"
          curl --fail --silent --show-error --location "$url" -o /tmp/eas-log.bin

          echo '=== LOG FILE TYPE ==='
          file /tmp/eas-log.bin
          echo '=== LOG MAGIC BYTES ==='
          xxd -l 24 /tmp/eas-log.bin

          python - <<'PY'
          from pathlib import Path
          import gzip, io, json, zipfile

          src = Path('/tmp/eas-log.bin').read_bytes()
          out = b''
          kind = 'raw'
          try:
              if src.startswith(b'\x1f\x8b'):
                  out = gzip.decompress(src)
                  kind = 'gzip'
              elif src.startswith(b'PK\x03\x04'):
                  kind = 'zip'
                  with zipfile.ZipFile(io.BytesIO(src)) as zf:
                      chunks = []
                      for name in zf.namelist():
                          if not name.endswith('/'):
                              chunks.append(zf.read(name))
                      out = b'\n'.join(chunks)
              else:
                  out = src
          except Exception as exc:
              print(f'DECODE_WARNING {exc!r}')
              out = src

          text = None
          for encoding in ('utf-8', 'utf-16', 'latin-1'):
              try:
                  candidate = out.decode(encoding)
                  if candidate:
                      text = candidate
                      break
              except Exception:
                  pass
          if text is None:
              text = out.decode('utf-8', errors='replace')

          text = text.replace('\x00', '')
          Path('/tmp/eas-log-decoded.txt').write_text(text, encoding='utf-8')
          print(f'DECODE_KIND {kind}')
          print(f'DECODED_CHARS {len(text)}')
          PY

          echo '=== GRADLE FAILURE EXCERPTS ==='
          grep -niE -B 30 -A 90 \
            'FAILURE: Build failed|What went wrong|Execution failed for task|Could not resolve|Could not determine|Caused by:|Manifest merger failed|Duplicate class|AAPT2?|resource.*not found|google-services|R8|Kotlin compilation|Gradle build daemon disappeared|BUILD FAILED|error:' \
            /tmp/eas-log-decoded.txt | tail -n 700 || true

          echo '=== FINAL 220 LOG LINES ==='
          tail -n 220 /tmp/eas-log-decoded.txt
