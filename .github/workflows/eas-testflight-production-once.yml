name: EAS iOS Production TestFlight Once

on:
  push:
    branches:
      - automation/ios-testflight-production-8c6c7112

permissions:
  contents: read

concurrency:
  group: eas-ios-production-testflight-8c6c7112
  cancel-in-progress: false

jobs:
  build-submit-ios:
    name: Build and submit iOS production 8c6c7112
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout frozen release candidate
        uses: actions/checkout@v4
        with:
          ref: 8c6c71123e126111757268c009e45cc45aba5328

      - name: Verify exact source SHA
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="8c6c71123e126111757268c009e45cc45aba5328"
          echo "Source SHA: $actual"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Typecheck release candidate
        run: npm run typecheck

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
          npx eas-cli@latest whoami --non-interactive

      - name: Build production iOS and submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx eas-cli@latest build
          --platform ios
          --profile production
          --auto-submit-with-profile production
          --non-interactive
          --message "LetsGoRide 2.0.2 production release candidate 8c6c7112"
