name: Mobile Audit Safe Fix

on:
  push:
    branches:
      - security/mobile-audit-safe-fix

permissions:
  contents: write

jobs:
  safe-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact security branch
        uses: actions/checkout@v4
        with:
          ref: security/mobile-audit-safe-fix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install exact current dependencies
        working-directory: mobile
        run: npm ci

      - name: Record audit before fix
        working-directory: mobile
        shell: bash
        run: |
          npm audit --json > /tmp/audit-before.json || true
          node - <<'NODE'
          const r=require('/tmp/audit-before.json');
          console.log('AUDIT_BEFORE', JSON.stringify(r.metadata?.vulnerabilities || {}));
          NODE

      - name: Apply only non-breaking npm audit fixes
        working-directory: mobile
        shell: bash
        run: |
          # npm audit fix exits non-zero if any advisory remains, even when it
          # successfully applied every non-breaking fix. Remaining findings are
          # evaluated independently below after compatibility and regression gates.
          npm audit fix || true

      - name: Reinstall from resulting lockfile
        working-directory: mobile
        run: npm ci

      - name: Expo compatibility doctor
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Verify Android production config
        working-directory: mobile
        run: npm run verify:android

      - name: Full Jest suite
        working-directory: mobile
        shell: bash
        run: |
          set -uo pipefail
          while IFS= read -r test_file; do
            echo "=== RUNNING ${test_file} ==="
            if timeout 60s npx jest --runTestsByPath "$test_file" --runInBand --detectOpenHandles --testTimeout=15000; then
              echo "=== PASSED ${test_file} ==="
            else
              status=$?
              echo "::error file=${test_file}::Test file failed with exit code ${status}"
              exit "$status"
            fi
          done < <(find __tests__ -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)

      - name: Record remaining audit and fail on critical
        working-directory: mobile
        shell: bash
        run: |
          npm audit --json > /tmp/audit-after.json || true
          node - <<'NODE'
          const r=require('/tmp/audit-after.json');
          const meta=r.metadata?.vulnerabilities || {};
          console.log('AUDIT_AFTER', JSON.stringify(meta));
          const vulns=r.vulnerabilities || {};
          for (const [name,v] of Object.entries(vulns)) {
            console.log('AUDIT_REMAINING', JSON.stringify({name,severity:v.severity,direct:Boolean(v.isDirect),range:v.range,via:(v.via||[]).map(x=>typeof x==='string'?x:x.name),effects:v.effects||[],fixAvailable:v.fixAvailable}));
          }
          if ((meta.critical || 0) > 0) process.exit(1);
          NODE

      - name: Commit only safe dependency metadata changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo "No additional semver-compatible dependency fix available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "security: apply non-breaking mobile dependency fixes"
          git push origin HEAD:security/mobile-audit-safe-fix
