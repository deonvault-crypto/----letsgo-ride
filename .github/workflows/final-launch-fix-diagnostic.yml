name: Final Launch Fix Guard

on:
  push:
    branches:
      - release/final-launch-fixes

permissions:
  contents: write

concurrency:
  group: final-launch-fix-guard
  cancel-in-progress: true

jobs:
  repair-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[guarded-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/final-launch-fixes
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Repair Ride Now assets and apply final launch fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFile, ImageOps, UnidentifiedImageError

          root = Path('mobile/assets/images/hailing')
          economy_path = root / 'ride-economy.png'
          comfort_path = root / 'ride-comfort.png'
          xl_path = root / 'ride-xl.png'

          def strict_open(path: Path):
              ImageFile.LOAD_TRUNCATED_IMAGES = False
              with Image.open(path) as image:
                  image.load()
                  return image.convert('RGBA')

          economy = strict_open(economy_path)
          assert economy.size == (320, 180)

          def recover(path: Path):
              try:
                  return strict_open(path), 'strict'
              except (UnidentifiedImageError, OSError, SyntaxError):
                  ImageFile.LOAD_TRUNCATED_IMAGES = True
                  try:
                      with Image.open(path) as image:
                          image.load()
                          recovered = image.convert('RGBA')
                          return recovered, 'truncated-recovery'
                  except (UnidentifiedImageError, OSError, SyntaxError):
                      return None, 'unrecoverable'
                  finally:
                      ImageFile.LOAD_TRUNCATED_IMAGES = False

          comfort, comfort_mode = recover(comfort_path)
          if comfort is None:
              # The intended Comfort blob is structurally corrupt. Preserve the
              # premium side-profile language with a deterministic sedan fallback
              # derived from the known-good local Economy asset rather than using
              # a remote/unreviewed image before launch.
              comfort = ImageOps.mirror(economy)
              comfort = ImageEnhance.Brightness(comfort).enhance(1.16)
              comfort = ImageEnhance.Contrast(comfort).enhance(1.04)
              comfort_mode = 'economy-derived-premium-sedan-fallback'
          comfort.save(comfort_path, 'PNG', optimize=True)

          xl, xl_mode = recover(xl_path)
          if xl is None:
              raise RuntimeError('XL premium asset is corrupt and could not be safely recovered; refusing to replace the SUV with a different class.')
          xl.save(xl_path, 'PNG', optimize=True)

          for path in (economy_path, comfort_path, xl_path):
              image = strict_open(path)
              assert image.size == (320, 180), (path, image.size)
              assert image.getchannel('A').getbbox(), f'{path} is fully transparent'
              print({'asset': path.name, 'validated': True, 'alpha_bbox': image.getchannel('A').getbbox()})
          print({'comfort_repair': comfort_mode, 'xl_repair': xl_mode})

          replacements = {
              Path('mobile/app/(driver)/post-trip.tsx'): [
                  ('<Text style={styles.eyebrow}>SHARE A ROUTE</Text>', '<Text style={styles.eyebrow}>INTERCITY · CITY TO CITY</Text>'),
                  ('<Text style={styles.body}>Build the journey first. Seats, price and vehicle details follow the route.</Text>', '<Text style={styles.body}>Post a city-to-city passenger trip. Ride Now e-hailing does not require posting.</Text>'),
              ],
              Path('mobile/app/(driver)/trips.tsx'): [
                  ('<Text style={styles.eyebrow}>YOUR ROAD</Text>', '<Text style={styles.eyebrow}>INTERCITY · CITY TO CITY</Text>'),
                  ('<Text style={styles.body}>Upcoming intercity trips and passenger-ready routes, without the dashboard clutter.</Text>', '<Text style={styles.body}>Your city-to-city passenger trips. Ride Now e-hailing requests are handled separately.</Text>'),
                  ('body="Post a trip to start accepting passenger seat requests."', 'body="Post an intercity trip to start accepting passenger seat requests."'),
              ],
              Path('mobile/app/(driver)/availability.tsx'): [
                  ('<Text style={styles.eyebrow}>DRIVING CALENDAR</Text>', '<Text style={styles.eyebrow}>INTERCITY · CITY TO CITY</Text>'),
                  ('<Text style={styles.body}>Mark the windows you’re available. Your route planning stays separate from Ride Now’s live online status.</Text>', '<Text style={styles.body}>Set availability for city-to-city routes. Ride Now online status stays separate.</Text>'),
              ],
          }
          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  if old not in text:
                      raise RuntimeError(f'Expected launch-copy source not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          cat > backend/app/services/profile_photo_service.py <<'PYFILE'
          import io
          import logging
          from pathlib import Path
          from typing import Any, Dict

          import cloudinary
          import cloudinary.uploader
          from fastapi import UploadFile

          from app.config import get_settings
          from app.database import database
          from app.services.notification_service import notify_admins
          from app.services.upload_security_service import validate_upload
          from app.utils import new_id, now_iso


          logger = logging.getLogger(__name__)
          STORAGE_ROOT = Path(__file__).resolve().parents[2] / "storage" / "profile_photos"
          ALLOWED_CONTENT_TYPES = {"image/jpeg", "image/png", "image/webp"}
          WORKER_ROLES_REQUIRING_REVIEW = {"driver", "courier"}


          class ProfilePhotoStorageError(RuntimeError):
              pass


          def _safe_file_name(file_name: str) -> str:
              stem = "".join(character for character in file_name if character.isalnum() or character in ("-", "_", ".")).strip(".")
              return stem or "profile-photo"


          def absolute_profile_photo_url(relative_url: str) -> str:
              if relative_url.startswith("http://") or relative_url.startswith("https://"):
                  return relative_url
              base_url = getattr(get_settings(), "public_api_base_url", "").rstrip("/")
              return f"{base_url}{relative_url}" if base_url else relative_url


          def _cloudinary_settings_ready(settings) -> bool:
              return bool(
                  settings.cloudinary_cloud_name
                  and settings.cloudinary_api_key
                  and settings.cloudinary_api_secret
              )


          def _store_profile_photo_in_cloudinary(user: Dict[str, Any], data: bytes, filename: str) -> str:
              settings = get_settings()
              if not _cloudinary_settings_ready(settings):
                  raise ProfilePhotoStorageError("Durable profile photo storage is not configured.")

              cloudinary.config(
                  cloud_name=settings.cloudinary_cloud_name,
                  api_key=settings.cloudinary_api_key,
                  api_secret=settings.cloudinary_api_secret,
                  secure=True,
              )
              file_obj = io.BytesIO(data)
              file_obj.name = filename
              try:
                  result = cloudinary.uploader.upload(
                      file_obj,
                      resource_type="image",
                      type="upload",
                      folder=f"letsgoride/profile-photos/{user['id']}",
                      public_id=new_id(),
                      overwrite=False,
                  )
              except Exception as exc:
                  logger.exception("profile_photo_upload cloudinary_failed user_id=%s", user.get("id"))
                  raise ProfilePhotoStorageError("Unable to store profile photo safely. Please try again.") from exc

              secure_url = str(result.get("secure_url") or "").strip()
              if not secure_url.startswith("https://"):
                  raise ProfilePhotoStorageError("Profile photo storage did not return a secure URL.")
              return secure_url


          def _store_profile_photo_locally(user: Dict[str, Any], data: bytes) -> str:
              user_dir = STORAGE_ROOT / user["id"]
              user_dir.mkdir(parents=True, exist_ok=True)
              file_name = f"{new_id()}_profile-photo.jpg"
              target_path = user_dir / file_name
              target_path.write_bytes(data)
              return absolute_profile_photo_url(f"/media/profile-photos/{user['id']}/{file_name}")


          async def save_profile_photo(user: Dict[str, Any], upload: UploadFile) -> Dict[str, Any]:
              validated = await validate_upload(
                  upload,
                  max_bytes=4 * 1024 * 1024,
                  allow_pdf=False,
                  stem="profile-photo",
                  max_image_edge=1280,
              )
              settings = get_settings()
              original_name = _safe_file_name(upload.filename or "profile-photo.jpg")

              # Render's filesystem is ephemeral. Production must never write a
              # profile photo URL to Mongo unless the bytes already live in durable
              # Cloudinary storage. Local storage remains available only for local
              # development/tests.
              if settings.is_production:
                  absolute_url = _store_profile_photo_in_cloudinary(
                      user,
                      validated.data,
                      original_name,
                  )
              else:
                  absolute_url = _store_profile_photo_locally(user, validated.data)

              timestamp = now_iso()
              role = str(user.get("role") or "passenger")

              if role in WORKER_ROLES_REQUIRING_REVIEW:
                  updates = {
                      "profile_photo_pending_url": absolute_url,
                      "profile_photo_pending_name": upload.filename or "profile-photo.jpg",
                      "profile_photo_review_status": "pending",
                      "profile_photo_rejection_reason": None,
                      "profile_photo_submitted_at": timestamp,
                      "profile_photo_reviewed_at": None,
                      "profile_photo_reviewed_by": None,
                      "updated_at": timestamp,
                  }
                  if user.get("profile_photo_verified") is not True:
                      updates["profile_photo_verified"] = False

                  updated = await database.update_one("users", user["id"], updates) or {**user, **updates}
                  await notify_admins(
                      "worker_profile_photo",
                      "Worker photo needs review",
                      f"{user.get('name') or 'A worker'} submitted a {role.title()} profile photo.",
                      {
                          "user_id": user["id"],
                          "worker_role": role,
                          "notification_target": "admin_worker_profile_photo",
                      },
                  )
                  return updated

              updates = {
                  "profile_photo_url": absolute_url,
                  "profile_photo_name": upload.filename or "profile-photo.jpg",
                  "profile_photo_verified": False,
                  "profile_photo_review_status": "not_required",
                  "updated_at": timestamp,
              }
              updated = await database.update_one("users", user["id"], updates)
              return updated or {**user, **updates}
          PYFILE

          cat > backend/tests/test_profile_photo_durable_storage.py <<'PYTEST'
          from types import SimpleNamespace
          from unittest.mock import AsyncMock, Mock

          import pytest

          from app.services import profile_photo_service as service


          @pytest.fixture
          def validated_upload(monkeypatch):
              monkeypatch.setattr(
                  service,
                  "validate_upload",
                  AsyncMock(return_value=SimpleNamespace(data=b"validated-image-bytes")),
              )
              monkeypatch.setattr(service, "notify_admins", AsyncMock(return_value=None))
              monkeypatch.setattr(service.database, "update_one", AsyncMock(side_effect=lambda _collection, _id, updates: {"id": _id, **updates}))
              return SimpleNamespace(filename="driver-face.png")


          @pytest.mark.asyncio
          async def test_production_worker_photo_uses_durable_cloudinary_before_mongo(monkeypatch, validated_upload):
              settings = SimpleNamespace(
                  is_production=True,
                  cloudinary_cloud_name="cloud",
                  cloudinary_api_key="key",
                  cloudinary_api_secret="secret",
                  public_api_base_url="https://api.example.com",
              )
              monkeypatch.setattr(service, "get_settings", lambda: settings)
              config = Mock()
              upload = Mock(return_value={"secure_url": "https://res.cloudinary.com/cloud/image/upload/driver-face.jpg"})
              monkeypatch.setattr(service.cloudinary, "config", config)
              monkeypatch.setattr(service.cloudinary.uploader, "upload", upload)

              result = await service.save_profile_photo(
                  {"id": "user-1", "name": "Driver One", "role": "driver", "profile_photo_verified": False},
                  validated_upload,
              )

              assert result["profile_photo_pending_url"].startswith("https://res.cloudinary.com/")
              assert result["profile_photo_review_status"] == "pending"
              assert result["profile_photo_verified"] is False
              assert upload.call_count == 1
              _, kwargs = upload.call_args
              assert kwargs["resource_type"] == "image"
              assert kwargs["type"] == "upload"
              assert kwargs["folder"] == "letsgoride/profile-photos/user-1"
              assert service.database.update_one.await_count == 1


          @pytest.mark.asyncio
          async def test_production_missing_cloudinary_fails_before_database_write(monkeypatch, validated_upload):
              settings = SimpleNamespace(
                  is_production=True,
                  cloudinary_cloud_name="",
                  cloudinary_api_key="",
                  cloudinary_api_secret="",
                  public_api_base_url="https://api.example.com",
              )
              monkeypatch.setattr(service, "get_settings", lambda: settings)
              service.database.update_one.reset_mock()

              with pytest.raises(service.ProfilePhotoStorageError, match="Durable profile photo storage"):
                  await service.save_profile_photo(
                      {"id": "user-2", "name": "Driver Two", "role": "driver"},
                      validated_upload,
                  )

              service.database.update_one.assert_not_awaited()


          @pytest.mark.asyncio
          async def test_nonproduction_keeps_local_profile_photo_storage(monkeypatch, tmp_path, validated_upload):
              settings = SimpleNamespace(
                  is_production=False,
                  cloudinary_cloud_name="",
                  cloudinary_api_key="",
                  cloudinary_api_secret="",
                  public_api_base_url="http://localhost:8000",
              )
              monkeypatch.setattr(service, "get_settings", lambda: settings)
              monkeypatch.setattr(service, "STORAGE_ROOT", tmp_path)
              service.database.update_one.reset_mock()

              result = await service.save_profile_photo(
                  {"id": "user-3", "name": "Passenger", "role": "passenger"},
                  validated_upload,
              )

              assert result["profile_photo_url"].startswith("http://localhost:8000/media/profile-photos/user-3/")
              assert list((tmp_path / "user-3").glob("*_profile-photo.jpg"))
          PYTEST

          cat > mobile/__tests__/intercity-driver-navigation-contract.test.ts <<'JEST'
          import fs from "fs";
          import path from "path";

          function source(relativePath: string) {
            return fs.readFileSync(path.join(__dirname, "..", relativePath), "utf8");
          }

          describe("Driver intercity navigation clarity", () => {
            test("Post is explicitly city-to-city and separate from Ride Now", () => {
              const content = source("app/(driver)/post-trip.tsx");
              expect(content).toContain("INTERCITY · CITY TO CITY");
              expect(content).toContain("Ride Now e-hailing does not require posting.");
            });

            test("Trips is explicitly intercity and separate from Ride Now", () => {
              const content = source("app/(driver)/trips.tsx");
              expect(content).toContain("INTERCITY · CITY TO CITY");
              expect(content).toContain("Ride Now e-hailing requests are handled separately.");
              expect(content).toContain("Post an intercity trip to start accepting passenger seat requests.");
            });

            test("Calendar is explicitly city-to-city and separate from Ride Now", () => {
              const content = source("app/(driver)/availability.tsx");
              expect(content).toContain("INTERCITY · CITY TO CITY");
              expect(content).toContain("Ride Now online status stays separate.");
            });
          });
          JEST

      - name: Validate backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install 'pytest>=8,<9' 'pytest-asyncio>=0.24,<1'
          python -m compileall -q app scripts tests
          python -c "from app.main import app; assert app.title == 'LetsGoRide API'"
          python -m pytest tests -q

      - name: Validate mobile
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json > /tmp/npm-audit-full.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json || true
          node ../.github/scripts/check-mobile-audit-policy.cjs /tmp/npm-audit-full.json /tmp/npm-audit-prod.json ../.github/security/mobile-audit-exceptions.json
          npm run typecheck
          npm run verify:android
          while IFS= read -r test_file; do
            echo "=== RUNNING ${test_file} ==="
            timeout 60s npx jest --runTestsByPath "$test_file" --runInBand --verbose --detectOpenHandles --testTimeout=15000
          done < <(find __tests__ -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)

      - name: Commit validated final launch fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "deonvault-crypto"
          git config user.email "deonvault@gmail.com"
          git add \
            backend/app/services/profile_photo_service.py \
            backend/tests/test_profile_photo_durable_storage.py \
            mobile/assets/images/hailing/ride-comfort.png \
            mobile/assets/images/hailing/ride-xl.png \
            'mobile/app/(driver)/post-trip.tsx' \
            'mobile/app/(driver)/trips.tsx' \
            'mobile/app/(driver)/availability.tsx' \
            mobile/__tests__/intercity-driver-navigation-contract.test.ts
          if git diff --cached --quiet; then
            echo "No guarded fixes to commit."
            exit 0
          fi
          git commit -m "Final launch: fix durable photos and driver clarity [guarded-fix]"
          git push origin HEAD:release/final-launch-fixes
