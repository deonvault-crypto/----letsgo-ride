name: LetsGoRide Support Chat Release Status Only
on:
  push:
    branches:
      - release/support-chat-ios42-testflight
    paths:
      - .github/workflows/ios42-testflight-upload-only.yml
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read current build and submission state
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const query = 'query($appId: String!) { app { byId(appId: $appId) { builds(limit: 5, offset: 0) { id status platform appVersion appBuildVersion gitCommitHash createdAt updatedAt } submissions(limit: 5, offset: 0, filter: {}) { id status platform submittedBuild { id } error { errorCode message } } } } }';
            const response = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', authorization: 'Bearer ' + process.env.EXPO_TOKEN },
              body: JSON.stringify({ query, variables: { appId: '6a3f6705-1e96-4f17-b884-b928baebf0ba' } }),
              signal: AbortSignal.timeout(30000)
            });
            const data = await response.json();
            if (!response.ok || data.errors) throw new Error(JSON.stringify(data.errors || { status: response.status }));
            console.log(JSON.stringify(data.data.app.byId));
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
