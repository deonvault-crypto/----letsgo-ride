name: LetsGoRide iOS 42 Submission Error Details
on:
  push:
    branches:
      - release/support-chat-ios42-testflight
    paths:
      - .github/workflows/ios42-testflight-upload-only.yml
permissions:
  contents: read
jobs:
  inspect:
    name: Read exact Expo submission error
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Query error and submission logs without mutation
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const query = 'query($submissionId: ID!) { submissions { byId(submissionId: $submissionId) { id status error { errorCode message } logFiles } } }';
            const response = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', authorization: 'Bearer ' + process.env.EXPO_TOKEN },
              body: JSON.stringify({ query, variables: { submissionId: 'a43a6667-85dc-4eba-8251-484e3b260095' } }),
              signal: AbortSignal.timeout(30000)
            });
            const data = await response.json();
            if (!response.ok || data.errors) throw new Error(JSON.stringify(data.errors || { status: response.status }));
            const submission = data.data.submissions.byId;
            console.log(JSON.stringify({ id: submission.id, status: submission.status, error: submission.error, logCount: submission.logFiles.length }));
            for (const url of submission.logFiles) {
              const logsResponse = await fetch(url, { signal: AbortSignal.timeout(30000) });
              if (!logsResponse.ok) throw new Error('Cannot read submission log');
              const text = await logsResponse.text();
              for (const line of text.split('\n')) {
                try {
                  const entry = JSON.parse(line);
                  if (entry.level >= 40 || /invalid|validation|error|closed|version|already|failed/i.test(entry.msg || '')) {
                    console.log(String(entry.msg || '').replace(/https?:\/\/\S+/g, '[URL omitted]'));
                  }
                } catch {}
              }
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
