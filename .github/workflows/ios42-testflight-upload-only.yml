name: LetsGoRide iOS 42 Submission Status Only
on:
  push:
    branches:
      - release/support-chat-ios42-testflight
    paths:
      - .github/workflows/ios42-testflight-upload-only.yml
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read existing submission status only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            for (const submissionId of ['a43a6667-85dc-4eba-8251-484e3b260095', 'c66ab82e-522e-47bd-8f28-053e08a5b201']) {
              const response = await fetch('https://api.expo.dev/graphql', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', authorization: 'Bearer ' + process.env.EXPO_TOKEN },
                body: JSON.stringify({
                  query: 'query($submissionId: ID!) { submissions { byId(submissionId: $submissionId) { id status error { errorCode message } } } }',
                  variables: { submissionId }
                }),
                signal: AbortSignal.timeout(30000)
              });
              const data = await response.json();
              if (!response.ok || data.errors) throw new Error(JSON.stringify(data.errors || { status: response.status }));
              console.log(JSON.stringify(data.data.submissions.byId));
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
