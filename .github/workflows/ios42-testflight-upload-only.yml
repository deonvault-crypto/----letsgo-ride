name: LetsGoRide iOS 42 Submission Diagnosis

on:
  push:
    branches:
      - release/support-chat-ios42-testflight
    paths:
      - .github/workflows/ios42-testflight-upload-only.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Read iOS 42 submission failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Read exact submission details
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@23.2.0 submit:view a43a6667-85dc-4eba-8251-484e3b260095 --json > "$RUNNER_TEMP/ios42-submission.json"
          node <<'NODE'
          const fs = require('fs');
          const submission = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ios42-submission.json', 'utf8'));
          function safe(value) {
            if (Array.isArray(value)) return value.map(safe);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value).filter(([key]) => !/token|secret|password|credential|private|url|issuer|key/i.test(key)).map(([key, v]) => [key, safe(v)]));
          }
          console.log('Submission fields:', Object.keys(submission));
          console.log(JSON.stringify(safe(submission), null, 2));
          NODE
      - name: Read Apple build status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@23.2.0 submit:status --platform ios --profile production --non-interactive
