name: LetsGoRide Android Communications Retry
on:
  push:
    branches: [build/android-communications-retry]
    paths: [.github/workflows/android-communications-retry.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Completed build helper is locked
        run: |
          echo "This helper is status-only. The authorized Android communications build has completed."
          echo "Review run 33769194711 for the verified build ID, version and AAB."
          echo "No build, submission or app update is started by this workflow."
