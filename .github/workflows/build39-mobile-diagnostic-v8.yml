name: Build 39 Mobile Diagnostic V8

on:
  push:
    branches:
      - final/build39-cleanup
    paths:
      - .github/workflows/build39-mobile-diagnostic-v8.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: final/build39-cleanup
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply exact V7 application patch set
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/build39_patch_fix.py
          python .github/scripts/build39_final_cleanup.py
          python .github/scripts/build39_additional_fixes.py
          python .github/scripts/build39_integrity_fix.py
          python .github/scripts/build39_mobile_type_fix.py
          git show 24038a8900d83209dd01ba938aab7d560b0c122b:mobile/assets/images/hailing/ride-comfort.png > mobile/assets/images/hailing/ride-comfort.png

      - name: Run mobile checks and capture exact failing command
        id: mobile
        shell: bash
        run: |
          set -u
          DIAG="$GITHUB_WORKSPACE/.github/diagnostics/build39-v8-mobile-error.log"
          mkdir -p "$(dirname "$DIAG")"
          rm -f "$DIAG"

          run_check() {
            local label="$1"
            shift
            local out
            out="$(mktemp)"
            echo "===== $label ====="
            set +e
            "$@" >"$out" 2>&1
            local code=$?
            set -e
            cat "$out"
            if [ "$code" -ne 0 ]; then
              {
                echo "FAILED_CHECK=$label"
                echo "EXIT_CODE=$code"
                echo "COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
                echo "----- failing output tail -----"
                tail -n 300 "$out"
              } > "$DIAG"
              rm -f "$out"
              exit "$code"
            fi
            rm -f "$out"
          }

          set -e
          cd mobile
          run_check "npm-ci" npm ci --no-audit --no-fund
          run_check "typecheck" npm run typecheck
          run_check "jest" npm test -- --runInBand
          run_check "verify-android" npm run verify:android
          echo "ALL_MOBILE_CHECKS_GREEN" > "$GITHUB_WORKSPACE/.github/diagnostics/build39-v8-mobile-green.log"

      - name: Persist exact mobile failure diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/diagnostics/build39-v8-mobile-error.log
          git config user.name "deonvault-crypto"
          git config user.email "deonvault@gmail.com"
          git add -f .github/diagnostics/build39-v8-mobile-error.log
          git commit -m "diagnostic: capture Build39 V8 mobile failure"
          git push origin HEAD:final/build39-cleanup
