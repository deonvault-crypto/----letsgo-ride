name: Repair Remaining Retired Ride Helper References

on:
  push:
    branches:
      - release/final-launch-fixes
    paths:
      - .github/workflows/final-launch-apply-fixes.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove retired ride helper references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/routers/rides.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '    is_public_ride,\n': '',
              '    if not ride or not is_public_ride(ride):\n': '    if not ride:\n',
              '    if not existing or not is_public_ride(existing):\n': '    if not existing:\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          if grep -Rni --exclude-dir='__pycache__' 'is_public_ride' backend/app; then
            echo '::error::Retired is_public_ride helper reference still exists in backend/app'
            exit 1
          fi
          git diff --check
      - name: Commit backend repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'deonvault-crypto'
          git config user.email 'deonvault@gmail.com'
          git add backend/app/routers/rides.py
          git commit -m 'fix: remove remaining retired ride helper references'
          git push origin HEAD:release/final-launch-fixes
