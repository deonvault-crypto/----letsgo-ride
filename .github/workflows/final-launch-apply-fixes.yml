name: Apply Final Production Launch Fixes

on:
  push:
    branches:
      - release/final-launch-fixes
    paths:
      - .github/workflows/final-launch-apply-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Apply production hardening and product fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:90]!r}')
              write(path, text.replace(old, new, 1))

          # --- Production settings: staging is retired, production DB is exact, mock OTP is retired,
          # and durable Cloudinary storage is mandatory in production.
          p = 'backend/app/config.py'
          text = read(p)
          text = text.replace(
              '        self.app_env = os.getenv("APP_ENV", "development")\n        self.mongodb_uri = os.getenv("MONGODB_URI", "").strip()\n        self.mongodb_db_name = os.getenv("MONGODB_DB_NAME", "letsgoride")\n        self.mock_otp = os.getenv("MOCK_OTP", "").strip()\n',
              '        self.app_env = os.getenv("APP_ENV", "development").strip().lower() or "development"\n        if self.app_env == "staging":\n            raise RuntimeError("APP_ENV=staging is retired; LetsGoRide ships production or local test/development only.")\n        self.mongodb_uri = os.getenv("MONGODB_URI", "").strip()\n        self.mongodb_db_name = os.getenv("MONGODB_DB_NAME", "letsgoride").strip() or "letsgoride"\n        if self.is_production and self.mongodb_db_name != "letsgoride":\n            raise RuntimeError("Production MONGODB_DB_NAME must be exactly letsgoride.")\n        if self.is_production and os.getenv("MOCK_OTP", "").strip():\n            raise RuntimeError("MOCK_OTP is forbidden in production.")\n',
              1,
          )
          cloud_anchor = '        self.cloudinary_api_secret = self._get_env_first("CLOUDINARY_API_SECRET") or cloudinary_url_config.get("api_secret", "")\n'
          if cloud_anchor not in text:
              raise SystemExit('config.py: cloudinary anchor missing')
          text = text.replace(
              cloud_anchor,
              cloud_anchor + '        self.cloudinary_configured = bool(self.cloudinary_cloud_name and self.cloudinary_api_key and self.cloudinary_api_secret)\n        if self.is_production and not self.cloudinary_configured:\n            raise RuntimeError("Production Cloudinary storage credentials must be configured.")\n',
              1,
          )
          text = re.sub(r'\n    @property\n    def mock_otp_allowed\(self\) -> bool:\n        return bool\(self\.mock_otp\) and self\.app_env\.strip\(\)\.lower\(\) in \{"development", "test"\}\n', '\n', text, count=1)
          write(p, text)

          # --- Mongo runtime is production-persistent only; remove demo-specific index key.
          replace_once('backend/app/database.py', 'PERSISTENT_DATABASE_ENVS = {"staging", "production"}', 'PERSISTENT_DATABASE_ENVS = {"production"}')
          replace_once(
              'backend/app/database.py',
              '        await self.db["rides"].create_index(\n            [("status", 1), ("is_demo", 1), ("updated_at", -1)],\n            name="admin_rides_by_status",\n        )',
              '        await self.db["rides"].create_index(\n            [("status", 1), ("updated_at", -1)],\n            name="admin_rides_by_status",\n        )',
          )

          # --- Remove retired staging geography escape hatch.
          p = 'backend/app/services/hailing_city_service.py'
          text = read(p)
          text = text.replace('STAGING_EXTERNAL_TEST_CITY_ID = "zw-harare"\n', '', 1)
          text, n = re.subn(
              r'\nasync def _staging_external_service_area\(\) -> Optional\[Dict\[str, Any\]\]:\n.*?\n\nasync def resolve_service_area',
              '\nasync def resolve_service_area',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('hailing_city_service.py: staging helper removal failed')
          old = '''    if not is_in_zimbabwe(latitude, longitude):\n        staging_area = await _staging_external_service_area()\n        if staging_area is not None:\n            return staging_area\n        return {"supported": False, "enabled": False, "reason": "outside_zimbabwe", "service_area": None, "ride_classes": []}\n'''
          new = '''    if not is_in_zimbabwe(latitude, longitude):\n        return {"supported": False, "enabled": False, "reason": "outside_zimbabwe", "service_area": None, "ride_classes": []}\n'''
          if old not in text:
              raise SystemExit('hailing_city_service.py: outside-Zimbabwe branch missing')
          write(p, text.replace(old, new, 1))

          # --- Remove legacy demo ride runtime behavior now that the five records were physically removed.
          p = 'backend/app/services/ride_service.py'
          text = read(p)
          text, n = re.subn(r'\nLEGACY_DEMO_RIDE_SIGNATURES = \{.*?\n\}\n', '\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('ride_service.py: legacy demo signatures not removed')
          text, n = re.subn(r'\ndef is_legacy_demo_ride\(ride: Dict\[str, Any\]\) -> bool:\n.*?\ndef ride_departure_datetime', '\ndef ride_departure_datetime', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('ride_service.py: demo helper block not removed')
          text = text.replace('        if not is_public_ride(ride):\n            continue\n', '', 1)
          text = text.replace('        is_public_ride(ride)\n        and public_ride_status(ride) == TRIP_STATUS_SCHEDULED\n', '        public_ride_status(ride) == TRIP_STATUS_SCHEDULED\n', 1)
          text, n = re.subn(r'\nasync def cleanup_demo_rides\(\) -> Dict\[str, int\]:\n.*?\n\nasync def create_ride', '\n\nasync def create_ride', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('ride_service.py: cleanup_demo_rides not removed')
          write(p, text)

          # Remove is_demo=False metadata from all runtime records; production no longer carries demo semantics.
          for path in Path('backend/app').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'^\s*"is_demo": False,\n', '', text, flags=re.M)
              text = text.replace(', "is_demo": False,', ',')
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # --- Admin no longer filters, counts, or exposes cleanup for demo rides.
          p = 'backend/app/routers/admin.py'
          text = read(p)
          text = text.replace(', cleanup_demo_rides,', ',', 1)
          text, n = re.subn(r'\n\ndef _is_real_ride\(ride: Dict\[str, Any\]\) -> bool:\n    return ride\.get\("is_demo"\) is not True\n', '', text, count=1)
          if n != 1:
              raise SystemExit('admin.py: _is_real_ride not removed')
          text = text.replace('database.count("rides", {"is_demo": {"$ne": True}})', 'database.count("rides")')
          text = text.replace('database.count("rides", {"is_demo": {"$ne": True}, "status": {"$in": active_ride_statuses}})', 'database.count("rides", {"status": {"$in": active_ride_statuses}})')
          text = text.replace('    rides = [ride for ride in await database.find_many("rides") if _is_real_ride(ride)]', '    rides = await database.find_many("rides")')
          text = text.replace('    if not ride or not _is_real_ride(ride):', '    if not ride:')
          text, n = re.subn(r'\n\n@router\.delete\("/rides/demo"\)\nasync def delete_demo_rides\(admin=Depends\(get_admin_user\)\):\n.*?\n    return api_success\(result\)\n?', '\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('admin.py: demo cleanup route not removed')
          write(p, text)

          # --- Retire mock OTP from real email verification/reset flows.
          p = 'backend/app/services/auth_service.py'
          text = read(p)
          text = text.replace(
              '    settings = get_settings()\n    local_mock_allowed = settings.mock_otp_allowed and code == settings.mock_otp\n    if not local_mock_allowed and (not code_not_expired(user) or not code_matches(user, code)):\n',
              '    if not code_not_expired(user) or not code_matches(user, code):\n',
              1,
          )
          text = text.replace(
              '    settings = get_settings()\n    local_mock_allowed = settings.mock_otp_allowed and code == settings.mock_otp\n    if not local_mock_allowed and (not code_not_expired(user, "reset") or not code_matches(user, code, "reset")):\n',
              '    if not code_not_expired(user, "reset") or not code_matches(user, code, "reset"):\n',
              1,
          )
          write(p, text)

          # Phone OTP endpoints stay compatibility-safe but are permanently unavailable until a real provider is wired.
          p = 'backend/app/routers/auth.py'
          text = read(p)
          text, n = re.subn(
              r'@router\.post\("/request-otp"\)\nasync def request_otp\(payload: RequestOtpBody, request: Request\):\n.*?\n\n@router\.post\("/verify-otp"\)',
              '@router.post("/request-otp")\nasync def request_otp(payload: RequestOtpBody, request: Request):\n    await rate_limit_service.enforce(request, "auth-otp-send", RateLimit(5, 3600), identity=payload.phone)\n    api_error("Phone verification is not available. Use secure email sign-in.", 503)\n\n\n@router.post("/verify-otp")',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('auth.py: request-otp patch failed')
          text, n = re.subn(
              r'@router\.post\("/verify-otp"\)\nasync def verify_otp\(payload: VerifyOtpBody, request: Request\):\n.*?\n\n@router\.post\("/register"\)',
              '@router.post("/verify-otp")\nasync def verify_otp(payload: VerifyOtpBody, request: Request):\n    await rate_limit_service.enforce(request, "auth-otp-verify", RateLimit(10, 900), identity=payload.phone)\n    api_error("Phone verification is not available. Use secure email sign-in.", 503)\n\n\n@router.post("/register")',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('auth.py: verify-otp patch failed')
          text, n = re.subn(
              r'@router\.post\("/register"\)\nasync def register\(payload: RegisterBody, request: Request\):\n.*?\n\n@router\.post\("/email-register"\)',
              '@router.post("/register")\nasync def register(payload: RegisterBody, request: Request):\n    await rate_limit_service.enforce(request, "auth-register", RateLimit(5, 3600), identity=payload.phone)\n    api_error("Phone registration is not available. Use secure email sign-up.", 503)\n\n\n@router.post("/email-register")',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('auth.py: register patch failed')
          write(p, text)

          # --- Durable Cloudinary-backed profile photos. Local disk is allowed only for dev/test fallback.
          profile = r'''from __future__ import annotations

import asyncio
import io
import logging
from pathlib import Path
from typing import Any, Dict

import cloudinary
import cloudinary.uploader
from fastapi import UploadFile

from app.config import get_settings
from app.database import database
from app.services.notification_service import notify_admins
from app.services.upload_security_service import validate_upload
from app.utils import new_id, now_iso


logger = logging.getLogger(__name__)
STORAGE_ROOT = Path(__file__).resolve().parents[2] / "storage" / "profile_photos"
WORKER_ROLES_REQUIRING_REVIEW = {"driver", "courier"}


class ProfilePhotoUploadError(RuntimeError):
    def __init__(self, message: str, status_code: int = 503) -> None:
        super().__init__(message)
        self.status_code = status_code


def absolute_profile_photo_url(relative_url: str) -> str:
    if relative_url.startswith("http://") or relative_url.startswith("https://"):
        return relative_url
    base_url = getattr(get_settings(), "public_api_base_url", "").rstrip("/")
    return f"{base_url}{relative_url}" if base_url else relative_url


def _configure_cloudinary() -> bool:
    settings = get_settings()
    if not settings.cloudinary_configured:
        return False
    cloudinary.config(
        cloud_name=settings.cloudinary_cloud_name,
        api_key=settings.cloudinary_api_key,
        api_secret=settings.cloudinary_api_secret,
        secure=True,
    )
    return True


def _upload_profile_photo(file_bytes: bytes, file_name: str, user_id: str) -> Dict[str, Any]:
    if not _configure_cloudinary():
        raise ProfilePhotoUploadError("Durable profile-photo storage is not configured.")
    file_obj = io.BytesIO(file_bytes)
    file_obj.name = file_name
    try:
        result = cloudinary.uploader.upload(
            file_obj,
            resource_type="image",
            type="upload",
            folder=f"letsgoride/profile-photos/{user_id}",
            use_filename=False,
            unique_filename=True,
            overwrite=False,
        )
    except Exception as exc:
        logger.warning("profile_photo_upload provider=cloudinary status=failed error_type=%s", type(exc).__name__)
        raise ProfilePhotoUploadError("Profile photo could not be stored securely. Please try again.") from exc
    if not result.get("secure_url") or not result.get("public_id"):
        raise ProfilePhotoUploadError("Profile photo storage returned an incomplete result. Please try again.")
    return result


def _destroy_profile_photo(public_id: str) -> None:
    if not public_id or not _configure_cloudinary():
        return
    try:
        cloudinary.uploader.destroy(public_id, resource_type="image", type="upload", invalidate=True)
    except Exception as exc:
        logger.warning("profile_photo_cleanup provider=cloudinary status=failed error_type=%s", type(exc).__name__)


async def delete_profile_photo_asset(public_id: str | None) -> None:
    if public_id:
        await asyncio.to_thread(_destroy_profile_photo, public_id)


def _local_development_photo(user_id: str, data: bytes) -> Dict[str, Any]:
    user_dir = STORAGE_ROOT / user_id
    user_dir.mkdir(parents=True, exist_ok=True)
    file_name = f"{new_id()}_profile-photo.jpg"
    (user_dir / file_name).write_bytes(data)
    return {
        "secure_url": absolute_profile_photo_url(f"/media/profile-photos/{user_id}/{file_name}"),
        "public_id": None,
        "resource_type": "image",
        "type": "local-development",
        "version": None,
    }


async def save_profile_photo(user: Dict[str, Any], upload: UploadFile) -> Dict[str, Any]:
    validated = await validate_upload(
        upload,
        max_bytes=4 * 1024 * 1024,
        allow_pdf=False,
        stem="profile-photo",
        max_image_edge=1280,
    )
    settings = get_settings()
    if settings.cloudinary_configured:
        stored = await asyncio.to_thread(
            _upload_profile_photo,
            validated.data,
            validated.file_name,
            user["id"],
        )
    elif settings.is_production:
        raise ProfilePhotoUploadError("Durable profile-photo storage is unavailable.")
    else:
        stored = _local_development_photo(user["id"], validated.data)

    absolute_url = str(stored["secure_url"])
    public_id = stored.get("public_id")
    timestamp = now_iso()
    role = str(user.get("role") or "passenger")
    provider_fields = {
        "url": absolute_url,
        "cloudinary_public_id": public_id,
        "resource_type": stored.get("resource_type") or "image",
        "delivery_type": stored.get("type") or "upload",
        "version": stored.get("version"),
    }

    if role in WORKER_ROLES_REQUIRING_REVIEW:
        updates = {
            "profile_photo_pending_url": provider_fields["url"],
            "profile_photo_pending_cloudinary_public_id": provider_fields["cloudinary_public_id"],
            "profile_photo_pending_resource_type": provider_fields["resource_type"],
            "profile_photo_pending_delivery_type": provider_fields["delivery_type"],
            "profile_photo_pending_version": provider_fields["version"],
            "profile_photo_pending_name": upload.filename or validated.file_name,
            "profile_photo_review_status": "pending",
            "profile_photo_rejection_reason": None,
            "profile_photo_submitted_at": timestamp,
            "profile_photo_reviewed_at": None,
            "profile_photo_reviewed_by": None,
            "updated_at": timestamp,
        }
        if user.get("profile_photo_verified") is not True:
            updates["profile_photo_verified"] = False
        try:
            updated = await database.update_one("users", user["id"], updates)
            if not updated:
                raise RuntimeError("User record was not found after profile-photo upload.")
        except Exception as exc:
            await delete_profile_photo_asset(public_id)
            raise ProfilePhotoUploadError("Profile photo was stored but could not be attached to the account. Please try again.") from exc
        try:
            await notify_admins(
                "worker_profile_photo",
                "Worker photo needs review",
                f"{user.get('name') or 'A worker'} submitted a {role.title()} profile photo.",
                {
                    "user_id": user["id"],
                    "worker_role": role,
                    "notification_target": "admin_worker_profile_photo",
                },
            )
        except Exception as exc:
            logger.warning("profile_photo_upload admin_notification=failed error_type=%s", type(exc).__name__)
        return updated

    updates = {
        "profile_photo_url": provider_fields["url"],
        "profile_photo_cloudinary_public_id": provider_fields["cloudinary_public_id"],
        "profile_photo_resource_type": provider_fields["resource_type"],
        "profile_photo_delivery_type": provider_fields["delivery_type"],
        "profile_photo_version": provider_fields["version"],
        "profile_photo_name": upload.filename or validated.file_name,
        "profile_photo_verified": False,
        "profile_photo_review_status": "not_required",
        "updated_at": timestamp,
    }
    old_public_id = user.get("profile_photo_cloudinary_public_id")
    try:
        updated = await database.update_one("users", user["id"], updates)
        if not updated:
            raise RuntimeError("User record was not found after profile-photo upload.")
    except Exception as exc:
        await delete_profile_photo_asset(public_id)
        raise ProfilePhotoUploadError("Profile photo was stored but could not be attached to the account. Please try again.") from exc
    if old_public_id and old_public_id != public_id:
        await delete_profile_photo_asset(str(old_public_id))
    return updated
'''
          write('backend/app/services/profile_photo_service.py', profile)

          # Auth router returns a safe service error for provider/storage failures.
          p = 'backend/app/routers/auth.py'
          text = read(p)
          text = text.replace('from app.services.profile_photo_service import save_profile_photo', 'from app.services.profile_photo_service import ProfilePhotoUploadError, save_profile_photo', 1)
          text = text.replace(
              '    except ValueError as error:\n        api_error(str(error), 400)\n    return api_success(public_user(updated))',
              '    except ValueError as error:\n        api_error(str(error), 400)\n    except ProfilePhotoUploadError as error:\n        api_error(str(error), error.status_code)\n    return api_success(public_user(updated))',
              1,
          )
          write(p, text)

          # Worker photo moderation moves provider metadata atomically and cleans rejected/replaced assets.
          p = 'backend/app/routers/admin_profile_photos.py'
          text = read(p)
          text = text.replace(
              'from app.services.notification_service import create_app_notification\n',
              'from app.services.notification_service import create_app_notification\nfrom app.services.profile_photo_service import delete_profile_photo_asset\n',
              1,
          )
          text = text.replace(
              '            "candidate_name": user.get("profile_photo_pending_name"),\n            "review_status": user.get("profile_photo_review_status") or "pending",',
              '            "candidate_name": user.get("profile_photo_pending_name"),\n            "cloudinary_public_id": user.get("profile_photo_pending_cloudinary_public_id"),\n            "resource_type": user.get("profile_photo_pending_resource_type"),\n            "delivery_type": user.get("profile_photo_pending_delivery_type"),\n            "version": user.get("profile_photo_pending_version"),\n            "review_status": user.get("profile_photo_review_status") or "pending",',
              1,
          )
          text = text.replace(
              '            "candidate_name": user.get("profile_photo_name"),\n            "review_status": user.get("profile_photo_review_status") or "pending",',
              '            "candidate_name": user.get("profile_photo_name"),\n            "cloudinary_public_id": user.get("profile_photo_cloudinary_public_id"),\n            "resource_type": user.get("profile_photo_resource_type"),\n            "delivery_type": user.get("profile_photo_delivery_type"),\n            "version": user.get("profile_photo_version"),\n            "review_status": user.get("profile_photo_review_status") or "pending",',
              1,
          )
          text = text.replace(
              '        "profile_photo_pending_url": None,\n        "profile_photo_pending_name": None,\n        "updated_at": timestamp,',
              '        "profile_photo_pending_url": None,\n        "profile_photo_pending_name": None,\n        "profile_photo_pending_cloudinary_public_id": None,\n        "profile_photo_pending_resource_type": None,\n        "profile_photo_pending_delivery_type": None,\n        "profile_photo_pending_version": None,\n        "updated_at": timestamp,',
              1,
          )
          text = text.replace(
              '                "profile_photo_name": candidate.get("candidate_name") or user.get("profile_photo_name"),\n                "profile_photo_verified": True,',
              '                "profile_photo_name": candidate.get("candidate_name") or user.get("profile_photo_name"),\n                "profile_photo_cloudinary_public_id": candidate.get("cloudinary_public_id"),\n                "profile_photo_resource_type": candidate.get("resource_type"),\n                "profile_photo_delivery_type": candidate.get("delivery_type"),\n                "profile_photo_version": candidate.get("version"),\n                "profile_photo_verified": True,',
              1,
          )
          anchor = '    updated = await database.update_one("users", user_id, updates) or {**user, **updates}\n'
          if anchor not in text:
              raise SystemExit('admin_profile_photos.py: update anchor missing')
          cleanup = '''    updated = await database.update_one("users", user_id, updates) or {**user, **updates}\n    candidate_public_id = candidate.get("cloudinary_public_id")\n    previous_public_id = user.get("profile_photo_cloudinary_public_id")\n    if payload.status == "rejected" and candidate_public_id:\n        await delete_profile_photo_asset(str(candidate_public_id))\n    elif payload.status == "approved" and replacement and previous_public_id and previous_public_id != candidate_public_id:\n        await delete_profile_photo_asset(str(previous_public_id))\n'''
          text = text.replace(anchor, cleanup, 1)
          write(p, text)

          # Health readiness exposes only non-secret storage readiness.
          p = 'backend/app/routers/health.py'
          text = read(p)
          text = text.replace(
              '    payments_ready = stripe_runtime_ready()\n    core_ready = database_ready and realtime_ready\n',
              '    payments_ready = stripe_runtime_ready()\n    storage_ready = settings.cloudinary_configured if settings.is_production else True\n    core_ready = database_ready and realtime_ready and storage_ready\n',
              1,
          )
          text = text.replace(
              '            "payments_status": "ready" if payments_ready else "degraded",\n',
              '            "payments_status": "ready" if payments_ready else "degraded",\n            "profile_storage_status": "ready" if storage_ready else "degraded",\n',
              1,
          )
          write(p, text)

          # --- Explicit Intercity product identity on the three Driver surfaces.
          p = 'mobile/components/layout/BottomNav.tsx'
          text = read(p).replace('{ label: "Trips", icon: "steering", href: "/(driver)/trips" },', '{ label: "Intercity", icon: "steering", href: "/(driver)/trips" },', 1)
          write(p, text)

          p = 'mobile/app/(driver)/post-trip.tsx'
          text = read(p)
          text = text.replace('<Screen navRole="driver" title="Post trip">', '<Screen navRole="driver" title="Post intercity ride">', 1)
          text = text.replace('<Text style={styles.eyebrow}>SHARE A ROUTE</Text>', '<Text style={styles.eyebrow}>INTERCITY RIDE</Text>', 1)
          text = text.replace('<Text style={styles.title}>Where are you driving?</Text>', '<Text style={styles.title}>Post an intercity route.</Text>', 1)
          text = text.replace('Build the journey first. Seats, price and vehicle details follow the route.', 'Scheduled rides between cities. Set the route first, then seats, fare and vehicle details.', 1)
          write(p, text)

          p = 'mobile/app/(driver)/trips.tsx'
