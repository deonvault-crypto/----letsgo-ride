name: Apply Final Production Launch Fixes

on:
  push:
    branches:
      - release/final-launch-fixes
    paths:
      - .github/workflows/final-launch-apply-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Apply controlled production fix batch
        run: python .github/scripts/final-launch-apply-fixes.py
      - name: Validate generated assets and runtime hygiene
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/check-hailing-assets.py
          ! grep -RniE --exclude-dir='__pycache__' '(STAGING_EXTERNAL_TEST_CITY_ID|_staging_external_service_area|LEGACY_DEMO_RIDE_SIGNATURES|cleanup_demo_rides|mock_otp_allowed|MOCK_OTP|"is_demo")' backend/app
          git diff --check
      - name: Commit controlled fix batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'deonvault-crypto'
          git config user.email 'deonvault@gmail.com'
          git add backend mobile .github/scripts/check-hailing-assets.py .github/workflows/platform-v2-ci.yml
          git status --short
          git commit -m 'fix: harden final production launch'
          git push origin HEAD:release/final-launch-fixes
