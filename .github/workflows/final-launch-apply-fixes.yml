name: Repair Complete Retired Ride Helper Chain

on:
  push:
    branches:
      - release/final-launch-fixes
    paths:
      - .github/workflows/final-launch-apply-fixes.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove complete retired ride helper chain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches for {old!r}, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Routers: all rides are production rides now; existence is the only gate.
          replace_exact('backend/app/routers/rides.py', '    is_public_ride,\n', '', 1)
          replace_exact('backend/app/routers/rides.py', '    if not ride or not is_public_ride(ride):\n', '    if not ride:\n', 1)
          replace_exact('backend/app/routers/rides.py', '    if not existing or not is_public_ride(existing):\n', '    if not existing:\n', 1)

          # Core ride service: remove legacy demo/public filtering everywhere.
          replace_exact('backend/app/services/ride_service.py', '        if not is_public_ride(ride):\n            continue\n', '', 2)
          replace_exact('backend/app/services/ride_service.py', '    if not ride or not is_public_ride(ride):\n', '    if not ride:\n', 6)

          # Review context: intercity rows are real by construction.
          replace_exact(
              'backend/app/services/review_context_service.py',
              'from app.services.ride_service import TRIP_STATUS_COMPLETED, apply_ride_lifecycle, canonical_trip_status, is_public_ride',
              'from app.services.ride_service import TRIP_STATUS_COMPLETED, apply_ride_lifecycle, canonical_trip_status',
              2,
          )
          replace_exact('backend/app/services/review_context_service.py', '    if not ride or not is_public_ride(ride):\n', '    if not ride:\n', 2)

          # Pending reviews: no demo/public filter remains.
          replace_exact(
              'backend/app/services/review_service.py',
              'from app.services.ride_service import TRIP_STATUS_COMPLETED, apply_ride_lifecycle, canonical_trip_status, is_public_ride',
              'from app.services.ride_service import TRIP_STATUS_COMPLETED, apply_ride_lifecycle, canonical_trip_status',
              1,
          )
          replace_exact('backend/app/services/review_service.py', '        if not is_public_ride(ride):\n            continue\n', '', 1)
          replace_exact('backend/app/services/review_service.py', '        if not ride or not is_public_ride(ride):\n', '        if not ride:\n', 1)

          # Bounded lifecycle sweeper operates directly on transitionable real rides.
          replace_exact(
              'backend/app/services/ride_lifecycle_scale_service.py',
              'from app.services.ride_service import apply_ride_lifecycle, canonical_trip_status, is_public_ride',
              'from app.services.ride_service import apply_ride_lifecycle, canonical_trip_status',
              1,
          )
          replace_exact('backend/app/services/ride_lifecycle_scale_service.py', '        if not is_public_ride(ride):\n            continue\n', '', 1)
          PY

          if grep -Rni --exclude-dir='__pycache__' 'is_public_ride' backend/app; then
            echo '::error::Retired is_public_ride helper reference still exists in backend/app'
            exit 1
          fi
          python -m compileall -q backend/app
          git diff --check
      - name: Commit complete backend repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'deonvault-crypto'
          git config user.email 'deonvault@gmail.com'
          git add \
            backend/app/routers/rides.py \
            backend/app/services/ride_service.py \
            backend/app/services/review_context_service.py \
            backend/app/services/review_service.py \
            backend/app/services/ride_lifecycle_scale_service.py
          git commit -m 'fix: remove retired ride visibility filter chain'
          git push origin HEAD:release/final-launch-fixes
