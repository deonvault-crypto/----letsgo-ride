name: Weekly Driver Settlement Apply Once

on:
  push:
    branches:
      - fix/product-polish-batch-production
    paths:
      - scripts/apply_weekly_driver_settlement.py
      - .github/workflows/weekly-driver-settlement-apply-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-driver-settlement-apply-once
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/product-polish-batch-production
          fetch-depth: 0

      - name: Align patch with current Wallet section name
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_weekly_driver_settlement.py')
          text = path.read_text()
          text = text.replace('Use the unique "Recent activity" title as boundary.', 'Use the unique "Recent earnings" title as boundary.')
          text = text.replace("recent_anchor = '        <View style={styles.section}>\\n          <Text style={styles.sectionTitle}>Recent activity</Text>'", "recent_anchor = '        <View style={styles.section}>\\n          <Text style={styles.sectionTitle}>Recent earnings</Text>'")
          text = text.replace('raise RuntimeError("Recent activity anchor missing")', 'raise RuntimeError("Recent earnings anchor missing")')
          text = text.replace("wallet = wallet.replace(recent_anchor, '        </View>\\n        ) : null}\\n\\n        <View style={styles.section}>\\n          <Text style={styles.sectionTitle}>Recent activity</Text>', 1)", "wallet = wallet.replace(recent_anchor, '        ) : null}\\n\\n        <View style={styles.section}>\\n          <Text style={styles.sectionTitle}>Recent earnings</Text>', 1)")
          path.write_text(text)
          PY

      - name: Apply settlement patch
        run: python scripts/apply_weekly_driver_settlement.py

      - name: Align database registry and finance regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          db_path = Path('backend/app/database.py')
          db = db_path.read_text()
          anchor = '    "hailing_trip_events",\n'
          additions = '    "hailing_trip_events",\n    "driver_fee_ledger",\n    "driver_fee_statements",\n    "driver_settlement_payments",\n'
          if '    "driver_fee_ledger",\n' not in db:
              if anchor not in db:
                  raise RuntimeError('database collection registry anchor missing')
              db = db.replace(anchor, additions, 1)
              db_path.write_text(db)

          Path('backend/tests/test_driver_cash_card_finance.py').write_text('''from __future__ import annotations

import unittest
from datetime import datetime, timezone
from unittest.mock import AsyncMock, patch

from app.database import database
from app.services.driver_weekly_settlement_service import (
    FEE_LEDGER_COLLECTION,
    PAYMENT_COLLECTION,
    STATEMENT_COLLECTION,
    _create_or_update_statement,
    apply_settlement_intent,
    enforce_driver_settlement_standing,
    prepare_settlement_payment,
    record_completed_ride_fee,
    settlement_summary,
    weekly_period_for,
)
from app.services.worker_wallet_service import wallet_summary


class DriverWeeklyPostpaidFinanceTests(unittest.IsolatedAsyncioTestCase):
    async def asyncSetUp(self):
        database.db = None
        for collection in (
            "users",
            "drivers",
            "hailing_trips",
            "app_notifications",
            FEE_LEDGER_COLLECTION,
            STATEMENT_COLLECTION,
            PAYMENT_COLLECTION,
        ):
            database.memory.setdefault(collection, [])
            await database.replace_collection(collection, [])
        self.user = {"id": "driver-user", "role": "driver", "name": "Test Driver", "email": "driver@example.com"}
        await database.insert_one("users", self.user)
        await database.insert_one("drivers", {"id": "driver-1", "user_id": self.user["id"], "verified": True})

    def completed_cash_trip(self, trip_id: str, *, fare: float, fee: float, completed_at: str):
        return {
            "id": trip_id,
            "driver_id": "driver-1",
            "driver_user_id": self.user["id"],
            "status": "COMPLETED",
            "payment_method": "cash",
            "payment_status": "cash_collected",
            "fare": {
                "total_fare": fare,
                "platform_commission": fee,
                "platform_commission_percent": round((fee / fare) * 100, 2),
            },
            "completed_at": completed_at,
            "created_at": completed_at,
        }

    async def test_completed_cash_trip_accrues_exact_snapshot_fee_once(self):
        trip = self.completed_cash_trip(
            "cash-trip",
            fare=10.00,
            fee=0.60,
            completed_at="2026-08-20T12:00:00+00:00",
        )
        first = await record_completed_ride_fee(trip)
        second = await record_completed_ride_fee(trip)
        self.assertEqual(first["fee_usd"], 0.60)
        self.assertEqual(first["gross_fare_usd"], 10.00)
        self.assertEqual(second["id"], first["id"])
        self.assertEqual(await database.count(FEE_LEDGER_COLLECTION, {}), 1)

    async def test_weekly_statement_is_exact_sum_and_wallet_does_no_manual_math(self):
        trips = [
            self.completed_cash_trip("ride-a", fare=10.00, fee=0.60, completed_at="2026-08-20T12:00:00+00:00"),
            self.completed_cash_trip("ride-b", fare=7.50, fee=0.45, completed_at="2026-08-21T12:00:00+00:00"),
        ]
        for trip in trips:
            await database.insert_one("hailing_trips", trip)
            await record_completed_ride_fee(trip)
        start, end = weekly_period_for(datetime(2026, 8, 20, 12, tzinfo=timezone.utc))
        with patch("app.services.driver_weekly_settlement_service._notify_statement", new=AsyncMock()):
            statement = await _create_or_update_statement(self.user["id"], start, end)
        self.assertIsNotNone(statement)
        self.assertEqual(statement["ride_count"], 2)
        self.assertEqual(statement["gross_fares_usd"], 17.50)
        self.assertEqual(statement["amount_due_usd"], 1.05)

        wallet = await wallet_summary(self.user)
        self.assertEqual(wallet["cash_collected_usd"], 17.50)
        self.assertEqual(wallet["platform_commission_usd"], 1.05)
        self.assertEqual(wallet["amount_due_to_platform_usd"], 1.05)
        self.assertEqual(wallet["platform_fee_policy"], "weekly_postpaid")
        self.assertTrue(wallet["driver_settlement"]["can_settle"])

    async def test_only_overdue_statement_blocks_new_ride_now_work(self):
        trip = self.completed_cash_trip("old-ride", fare=20.00, fee=1.20, completed_at="2026-08-10T12:00:00+00:00")
        await record_completed_ride_fee(trip)
        start, end = weekly_period_for(datetime(2026, 8, 10, 12, tzinfo=timezone.utc))
        with patch("app.services.driver_weekly_settlement_service._notify_statement", new=AsyncMock()):
            await _create_or_update_statement(self.user["id"], start, end)
            with self.assertRaises(PermissionError):
                await enforce_driver_settlement_standing(self.user)

    async def test_successful_stripe_settlement_clears_exact_statement(self):
        trip = self.completed_cash_trip("settle-ride", fare=25.00, fee=1.50, completed_at="2026-08-10T12:00:00+00:00")
        await record_completed_ride_fee(trip)
        start, end = weekly_period_for(datetime(2026, 8, 10, 12, tzinfo=timezone.utc))
        with patch("app.services.driver_weekly_settlement_service._notify_statement", new=AsyncMock()):
            statement = await _create_or_update_statement(self.user["id"], start, end)
        payment = await prepare_settlement_payment(self.user)
        self.assertEqual(payment["amount_usd"], 1.50)
        self.assertEqual(payment["statement_ids"], [statement["id"]])

        intent = {
            "id": "pi_weekly_test",
            "amount": 150,
            "currency": "usd",
            "status": "succeeded",
            "metadata": {
                "product": "driver_weekly_settlement",
                "settlement_payment_id": payment["id"],
                "user_id": self.user["id"],
            },
        }
        result = await apply_settlement_intent(intent, event_id="evt_weekly_test", event_type="payment_intent.succeeded")
        self.assertEqual(result["payment"]["status"], "paid")
        paid_statement = await database.find_one(STATEMENT_COLLECTION, {"id": statement["id"]})
        self.assertEqual(paid_statement["status"], "paid")
        summary = await settlement_summary(self.user)
        self.assertEqual(summary["amount_due_usd"], 0.0)
        self.assertFalse(summary["can_settle"])
        self.assertFalse(summary["ride_now_blocked"])


if __name__ == "__main__":
    unittest.main()
''')
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest

      - name: Backend compile and import
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_ENV: test
        run: |
          python -m compileall app
          python -c 'import app.main'

      - name: Backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_ENV: test
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Mobile tests
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Android release config verification
        working-directory: mobile
        run: npm run verify:android

      - name: Commit validated product changes
        run: |
          if git diff --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git config user.name 'deonvault-crypto'
          git config user.email 'deonvault@gmail.com'
          git add backend mobile
          git commit -m 'Add weekly postpaid driver settlement with Stripe'
          git push origin HEAD:fix/product-polish-batch-production
