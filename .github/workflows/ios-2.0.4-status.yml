name: LetsGoRide iOS 2.0.4 Status

on:
  push:
    branches:
      - release/ios-2.0.4-testflight
    paths:
      - .github/workflows/ios-2.0.4-status.yml

permissions:
  contents: read

jobs:
  status:
    name: Check iOS 2.0.4 Build 47 and TestFlight submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Check exact EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build:view 9a04f26a-afa3-401a-91d8-3dbf7e1a0241 --json
      - name: Check exact TestFlight submission
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest submit:view ce783d8f-80c0-4890-9512-7c6e8f5a3108 --json
      - name: Check App Store Connect/TestFlight status
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest submit:status --platform ios --profile production --json --non-interactive
