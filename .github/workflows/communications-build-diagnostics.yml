name: LetsGoRide Communications Build Diagnostics
on:
  push:
    branches: [audit/communications-build-diagnostics]
    paths: [.github/workflows/communications-build-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project configuration dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Read exact Android retry status
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@23.2.0 build:list --platform android --git-commit-hash 8de640e5a73a9a6e4178af6b89ecb2915d6411d1 --limit 1 --json --non-interactive > "$RUNNER_TEMP/android-retry-status.json"
          node <<'NODE'
          const fs=require('fs');
          const builds=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/android-retry-status.json','utf8'));
          const b=builds[0];
          if(!b || b.gitCommitHash!=='8de640e5a73a9a6e4178af6b89ecb2915d6411d1') throw Error('Exact Android retry not found');
          console.log(JSON.stringify({id:b.id,status:b.status,version:b.appVersion,buildNumber:b.appBuildVersion,runtimeVersion:b.runtimeVersion,createdAt:b.createdAt,completedAt:b.completedAt,artifacts:b.artifacts,error:b.error}));
          NODE
