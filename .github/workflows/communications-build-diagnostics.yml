name: LetsGoRide Communications Build Diagnostics
on:
  push:
    branches: [audit/communications-build-diagnostics]
    paths: [.github/workflows/communications-build-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project configuration dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Read failed Android build
        continue-on-error: true
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@23.2.0 build:view 46508cc7-a80d-4720-9ad6-73ac66eafd02 --json > "$RUNNER_TEMP/build-diagnostic.json"
      - name: Print error details without environment values
        run: |
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const raw=fs.readFileSync(process.env.RUNNER_TEMP+'/build-diagnostic.json','utf8');
            let build;
            try { build=JSON.parse(raw); } catch { console.log(raw.split('\n').filter(line=>/error|cannot|missing|failed|not found/i.test(line)).slice(-12).map(line=>line.replace(/https?:\/\/\S+/g,'[url]').replace(/AIza[0-9A-Za-z_-]+/g,'[REDACTED]')).join('\n')); throw Error('Build metadata was not JSON.'); }
            console.log(JSON.stringify({id:build.id,status:build.status,version:build.appVersion,buildNumber:build.appBuildVersion,error:build.error}));
            for(const url of build.logFiles || []) {
              const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
              if(!response.ok) throw Error('Build log retrieval failed: '+response.status);
              const log=await response.text();
              const entries=log.split('\n').filter(Boolean).map(line=>{try{return JSON.parse(line);}catch{return null;}}).filter(Boolean);
              const messages=entries.filter(entry=>entry.phase==='CONFIGURE_EXPO_UPDATES').map(entry=>String(entry.msg||'')).join('\n');
              const details=messages.slice(Math.max(0,messages.indexOf('Difference between local and EAS fingerprints')));
              console.log(details.split('\n').filter(line=>/"(op|filePath|id|reasons|hash)"\s*:/.test(line) && !/"contents"\s*:/.test(line)).slice(0,100).join('\n'));

            }
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
