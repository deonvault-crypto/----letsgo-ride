name: Build 39 Guarded Finalization V4

on:
  push:
    branches:
      - final/build39-cleanup
    paths:
      - .github/workflows/build39-finalize-v4.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: final/build39-cleanup
          fetch-depth: 0

      - name: Apply final cleanup patch set
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/build39_patch_fix.py
          python .github/scripts/build39_final_cleanup.py
          python .github/scripts/build39_additional_fixes.py

      - name: Install exact validated Comfort asset
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 24038a8900d83209dd01ba938aab7d560b0c122b^{commit}
          git show 24038a8900d83209dd01ba938aab7d560b0c122b:mobile/assets/images/hailing/ride-comfort.png > mobile/assets/images/hailing/ride-comfort.png
          node <<'NODE'
          const fs = require('fs');
          const buf = fs.readFileSync('mobile/assets/images/hailing/ride-comfort.png');
          const sig = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
          if (!buf.subarray(0, 8).equals(sig)) throw new Error('Comfort asset is not PNG');
          if (buf.readUInt32BE(16) !== 320 || buf.readUInt32BE(20) !== 180) throw new Error('Comfort asset dimensions changed');
          if (!buf.includes(Buffer.from('tRNS'))) throw new Error('Comfort asset is not transparent');
          if (buf.length > 100000) throw new Error('Comfort asset is too large');
          console.log(`validated Comfort: ${buf.length} bytes`);
          NODE

      - name: Remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git show 9ac86c2b8cfc097ddac97a0c7e5a3e6a159fcc0e:.github/workflows/admin-control-center-finalize-once.yml > .github/workflows/admin-control-center-finalize-once.yml
          rm -f .github/scripts/build39_final_cleanup.py .github/scripts/build39_patch_fix.py .github/scripts/build39_additional_fixes.py
          rm -f .github/workflows/build39-finalize-v2.yml .github/workflows/build39-finalize-v3.yml .github/workflows/build39-finalize-v4.yml
          git diff --check

      - name: Validate backend completely
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
          python -m compileall -q backend/app backend/tests
          cd backend
          pytest -q

      - name: Validate mobile completely
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- --runInBand
          npm run verify:android

      - name: Commit only the green application tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "deonvault-crypto"
          git config user.email "deonvault@gmail.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Build39: finish production cleanup"
          git push origin HEAD:final/build39-cleanup
