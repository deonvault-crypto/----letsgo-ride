name: LetsGoRide 2.0.5 Build Inspection

on:
  push:
    branches:
      - ops/mobile-2.0.5-build-only

permissions:
  contents: read

concurrency:
  group: letsgoride-mobile-2.0.5-build-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect exact production EAS builds
    if: github.ref == 'refs/heads/ops/mobile-2.0.5-build-only' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      RELEASE_SHA: c086d898c8bd618bd696c5a691d8796bb7e79448
    steps:
      - name: Checkout exact reviewed production SHA
        uses: actions/checkout@v4
        with:
          ref: c086d898c8bd618bd696c5a691d8796bb7e79448
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source pin
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@23.2.0 whoami --non-interactive

      - name: List EAS builds for exact production commit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@23.2.0 build:list \
            --platform all \
            --git-commit-hash "$RELEASE_SHA" \
            --limit 10 \
            --json \
            --non-interactive > ../eas-builds-existing.json
          cat ../eas-builds-existing.json

      - name: Preserve inspection result
        uses: actions/upload-artifact@v4
        with:
          name: letsgoride-2.0.5-eas-build-inspection
          path: eas-builds-existing.json
          if-no-files-found: error
          retention-days: 7
