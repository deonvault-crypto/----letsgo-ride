name: Publish multi-work-product OTA

on:
  push:
    branches:
      - ops/publish-multi-work-product-ota-20260914
    paths:
      - .github/workflows/publish-multi-work-product-ota.yml

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: 1a6e2feeafdbdfd544bcc2fc7c3eda7d265e8004
    steps:
      - name: Verify exact production source is still current and green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async () => {
            const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' };
            const branch = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/branches/platform-v2-m1-m6', { headers, signal: AbortSignal.timeout(30000) });
            if (!branch.ok) throw new Error('Cannot verify production branch.');
            const branchData = await branch.json();
            if (branchData.commit.sha !== process.env.TARGET_SHA) throw new Error('Production branch moved; refusing OTA publish.');
            const runsResponse = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/actions/runs?head_sha=' + process.env.TARGET_SHA + '&per_page=20', { headers, signal: AbortSignal.timeout(30000) });
            if (!runsResponse.ok) throw new Error('Cannot verify production CI.');
            const runs = (await runsResponse.json()).workflow_runs
              .filter(run => run.name === 'LetsGoRide Production CI' && run.event === 'push' && run.head_sha === process.env.TARGET_SHA)
              .sort((a, b) => b.id - a.id);
            if (runs[0]?.conclusion !== 'success') throw new Error('Exact production CI must pass before publishing.');
            console.log('Production SHA and CI verified:', process.env.TARGET_SHA);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - uses: actions/checkout@v4
        with:
          ref: 1a6e2feeafdbdfd544bcc2fc7c3eda7d265e8004
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Verify reviewed update configuration
        working-directory: mobile
        run: |
          node <<'NODE'
          const app = require('./app.json').expo;
          const eas = require('./eas.json');
          if (app.version !== '2.0.4') throw new Error('Expected production app version 2.0.4.');
          if (app.runtimeVersion?.policy !== 'fingerprint') throw new Error('Fingerprint runtime policy changed.');
          if (app.updates?.url !== 'https://u.expo.dev/6a3f6705-1e96-4f17-b884-b928baebf0ba') throw new Error('EAS Update project URL changed.');
          const env = eas.build.production.env;
          if (env.EXPO_PUBLIC_API_BASE_URL !== 'https://letsgoride-v2-production.onrender.com') throw new Error('Production API URL changed.');
          if (env.EXPO_PUBLIC_ENABLE_AUTHENTICATED_WEB !== 'false') throw new Error('Production auth setting changed.');
          console.log('Reviewed OTA configuration verified.');
          NODE
      - name: Publish production OTA update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: https://letsgoride-v2-production.onrender.com
          EXPO_PUBLIC_ENABLE_AUTHENTICATED_WEB: 'false'
        run: npx --yes eas-cli@23.2.0 update --channel production --environment production --message "Driver and Courier work modes on one account" --non-interactive
      - name: Show latest production update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@23.2.0 update:list --channel production --limit 1 --json --non-interactive
