name: Cloudflare migration prototype CI (no deploy)

on:
  pull_request:
    paths:
      - 'cloudflare-poc/**'
      - '.github/workflows/cloudflare-poc-check.yml'
  push:
    branches:
      - 'infra/vercel-migration-20261113'
    paths:
      - 'cloudflare-poc/**'
      - '.github/workflows/cloudflare-poc-check.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline lab checks (no credentials or deploy)
        working-directory: cloudflare-poc
        run: npm run check
