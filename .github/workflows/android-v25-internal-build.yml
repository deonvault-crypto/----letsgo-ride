name: LetsGoRide Android V25 Internal Verification Build

on:
  pull_request:
    branches:
      - platform-v2-m1-m6

permissions:
  contents: read

jobs:
  android-internal-build:
    name: Android production-profile build only
    if: github.head_ref == 'build/android-v25-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify app code matches merged platform commit
        working-directory: .
        run: git diff --exit-code 350b38126c84437f57cf7c22c02b5ec291f04559 -- mobile
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run verify:android
      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest whoami --non-interactive
      - name: Build Android production profile without Play submission
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile production --non-interactive
