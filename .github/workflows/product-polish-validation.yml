name: Product Polish Validation

on:
  push:
    branches:
      - fix/product-polish-batch-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-polish-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Validate Ride Now vehicle polish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled vehicle assets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'assets/images/hailing/ride-economy.png',
            'assets/images/hailing/ride-comfort.png',
            'assets/images/hailing/ride-xl.png',
          ];
          const pngSig = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]);
          for (const file of files) {
            const buf = fs.readFileSync(file);
            if (!buf.subarray(0, 8).equals(pngSig)) throw new Error(`${file} is not a PNG`);
            const width = buf.readUInt32BE(16);
            const height = buf.readUInt32BE(20);
            if (width !== 320 || height !== 180) throw new Error(`${file} has unexpected dimensions ${width}x${height}`);
            if (!buf.includes(Buffer.from('tRNS'))) throw new Error(`${file} has no transparency chunk`);
            if (buf.length > 100_000) throw new Error(`${file} is too large for a ride-card asset: ${buf.length} bytes`);
            console.log(`${file}: ${width}x${height}, ${buf.length} bytes, transparent`);
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Mobile tests
        run: npm test -- --runInBand

      - name: Android release config verification
        run: npm run verify:android
