name: EAS Production Final

on:
  push:
    branches:
      - release/2.0.2-eas-production

permissions:
  contents: read

concurrency:
  group: eas-production-final-2.0.2
  cancel-in-progress: false

jobs:
  queue-production-builds:
    name: Queue iOS TestFlight and Android production builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Android API and release policy
        run: npm run verify:android

      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required for production EAS builds."
            exit 1
          fi

      - name: Queue iOS production build and TestFlight submission
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx eas-cli@latest build
          --platform ios
          --profile production
          --auto-submit-with-profile production
          --non-interactive
          --no-wait
          --message "LetsGoRide 2.0.2 production final"

      - name: Queue Android production app bundle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx eas-cli@latest build
          --platform android
          --profile production
          --non-interactive
          --no-wait
          --message "LetsGoRide 2.0.2 production final"
