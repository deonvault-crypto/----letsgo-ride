name: Stripe mobile dependency

on:
  push:
    branches:
      - feature/stripe-card-payments

permissions:
  contents: write

concurrency:
  group: stripe-mobile-dependency
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stripe-card-payments
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Expo-compatible Stripe SDK
        working-directory: mobile
        run: npm install --save-exact @stripe/stripe-react-native@0.50.3
      - name: Commit dependency files when changed
        shell: bash
        run: |
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo "Stripe dependency already locked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "Add Expo-compatible Stripe React Native SDK"
          git push origin HEAD:feature/stripe-card-payments
