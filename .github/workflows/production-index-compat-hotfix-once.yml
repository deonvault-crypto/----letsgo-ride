name: Production Index Compatibility Hotfix Once

on:
  push:
    branches:
      - hotfix/2.0.2-production-index-compat

permissions:
  contents: write

concurrency:
  group: production-index-compat-hotfix-once
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/2.0.2-production-index-compat
          fetch-depth: 0

      - name: Apply production-compatible notification index name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/database.py')
          text = path.read_text(encoding='utf-8')
          old = 'name="admin_notifications_unread"'
          new = 'name="notifications_unread_by_user"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one notification index rename target, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('backend/tests/test_production_index_compat.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_notification_unread_index_reuses_live_production_name():\n    source = Path("app/database.py").read_text(encoding="utf-8")\n    assert 'name="notifications_unread_by_user"' in source\n    assert 'name="admin_notifications_unread"' not in source\n''', encoding='utf-8')
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime and test dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests

      - name: Run complete backend contracts
        working-directory: backend
        env:
          ENABLE_DEMO_SEED: 'false'
        run: pytest -q

      - name: Remove one-time workflow and commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/production-index-compat-hotfix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/database.py backend/tests/test_production_index_compat.py .github/workflows/production-index-compat-hotfix-once.yml
          git diff --cached --check
          git commit -m 'Fix production notification index compatibility'
          git push origin HEAD:hotfix/2.0.2-production-index-compat
