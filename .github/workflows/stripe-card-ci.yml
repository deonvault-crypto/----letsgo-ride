name: Stripe Card CI

on:
  push:
    branches:
      - feature/stripe-card-payments

permissions:
  contents: read

concurrency:
  group: stripe-card-ci
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app scripts tests
      - name: Stripe payment tests
        env:
          ENABLE_DEMO_SEED: "false"
        run: python -m unittest tests.test_stripe_hailing_payments -v
      - name: Hailing regression tests
        env:
          ENABLE_DEMO_SEED: "false"
        run: python -m unittest tests.test_hailing_v3 tests.test_hailing_dispatch_service tests.test_hailing_driver_offer_realtime tests.test_realtime_foundation tests.test_realtime_native_origin -v

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:android
