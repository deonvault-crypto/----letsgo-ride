name: EAS iOS Build 34 Production TestFlight Once

on:
  push:
    branches:
      - automation/ios-build34-production-d6869710

permissions:
  contents: read

concurrency:
  group: eas-ios-production-testflight-build34-d6869710
  cancel-in-progress: false

jobs:
  build-submit-ios:
    name: Build and submit iOS production d6869710
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact green Build 34 candidate
        uses: actions/checkout@v4
        with:
          ref: d6869710adbcacbcc7d7a8c34975b013aa0e6079

      - name: Verify exact source SHA
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="d6869710adbcacbcc7d7a8c34975b013aa0e6079"
          echo "Source SHA: $actual"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Typecheck exact release candidate
        run: npm run typecheck

      - name: Verify Android release policy remains valid
        run: npm run verify:android

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
          npx eas-cli@latest whoami --non-interactive

      - name: Build production iOS and submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx eas-cli@latest build
          --platform ios
          --profile production
          --auto-submit-with-profile production
          --non-interactive
          --message "LetsGoRide 2.0.2 Build 34 recovery candidate d6869710"
