<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="light">
  <title>LetsGoRide Operations</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/live-map.css">
  <link rel="stylesheet" href="/support-conversations.css?v=3">
  <link rel="stylesheet" href="/communications.css">
  <link rel="stylesheet" href="/control-center-v2.css?v=2">
  <link rel="stylesheet" href="/proactive-support.css?v=1">
  <link rel="stylesheet" href="/workforce-applications.css?v=1">
</head>
<body>
  <main id="loginView" class="login-wrap">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="brand">Lets<span>Go</span>Ride</div>
      <p class="eyebrow">Operations Control Center</p>
      <h1 id="loginTitle">Team sign in</h1>
      <p class="muted">Authorized Customer Support, Managers and Admins only.</p>
      <form id="loginForm" autocomplete="on">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="loginBtn" type="submit" class="primary">Sign in securely</button>
      </form>
      <p id="loginError" class="error" hidden></p>
      <p class="security-note">Staff permissions are enforced by the production API. This dashboard never connects directly to the database.</p>
    </section>
  </main>

  <div id="appView" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="side-top">
        <div class="brand side-brand">Lets<span>Go</span>Ride</div>
        <p>Operations</p>
      </div>
      <nav id="nav" aria-label="Operations navigation">
        <button data-view="overview" class="active"><span>Overview</span></button>
        <button data-view="live"><span>Live operations</span></button>
        <button data-view="cases"><span>Cases</span><span id="caseBadge" class="nav-badge" hidden></span></button>
        <button data-view="support"><span>Customer support</span></button>
        <button data-view="communications"><span>Communications</span></button>
        <button data-view="appUpdates" id="appUpdatesNav"><span>App updates</span></button>
        <button data-view="users"><span>People</span></button>
        <button data-view="safety"><span>Safety</span></button>
        <button data-view="verifications" id="verificationNav"><span>Verification</span></button>
        <button data-view="staff" id="staffNav"><span>Staff & roles</span></button>
        <button data-view="audit" id="auditNav"><span>Audit trail</span></button>
      </nav>
      <div class="side-bottom">
        <div id="staffIdentity" class="identity"></div>
        <button id="logoutBtn" class="ghost">Sign out</button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">LetsGoRide Zimbabwe</p>
          <h1 id="pageTitle">Operations overview</h1>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="secondary">Refresh</button>
          <div class="status-pill"><span class="dot"></span> Production</div>
        </div>
      </header>

      <section id="overviewView" class="view"></section>
      <section id="liveView" class="view" hidden></section>
      <section id="casesView" class="view" hidden></section>
      <section id="supportView" class="view" hidden></section>
      <section id="communicationsView" class="view" hidden></section>
      <section id="appUpdatesView" class="view" hidden></section>
      <section id="usersView" class="view" hidden></section>
      <section id="safetyView" class="view" hidden></section>
      <section id="verificationsView" class="view" hidden></section>
      <section id="staffView" class="view" hidden></section>
      <section id="auditView" class="view" hidden></section>
    </main>
  </div>

  <dialog id="caseDialog" class="modal">
    <form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form>
    <div id="caseDialogBody"></div>
  </dialog>

  <dialog id="actionDialog" class="modal compact-modal">
    <form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form>
    <div id="actionDialogBody"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="/map-framing.js?v=2" defer></script>
  <script src="/app.js?v=canonical-refresh-1" defer></script>
  <script src="/support-conversations.js?v=3" defer></script>
  <script src="/live-map.js?v=2" defer></script>
  <script src="/control-center-v2.js?v=2" defer></script>
  <script src="/admin-self-protection.js?v=1" defer></script>
  <script src="/proactive-support.js?v=2" defer></script>
  <script src="/workforce-applications.js?v=3" defer></script>
  <script src="/ops-live-reconcile.js?v=1" defer></script>
  <script src="/communications.js"></script>
</body>
</html>
